		// 18) The prison's ladder and the way out of it.
		//
		//     (a) A rank used to buy one thing - which ore was under your feet - over a flat price
		//     table, so climbing was the same work with a bigger number on it. The trustee rate is
		//     the other half, and it is applied in the one place that pays a sale so it can never be
		//     applied twice.
		//
		//     (b) The way out of prison lived in memory only, so a restart released a prisoner at the
		//     world spawn instead of the spot they were booked in from.
		//
		//     (c) Full Heat escalated by arithmetic nobody can feel - four guards instead of two. The
		//     Warden is what it sends instead, and one line in the tick is what sends him.
		[
			['economy/PrisonManager.java', /long paid = total \* \(100L \+ percent\) \/ 100L/, 'PrisonManager: a sale no longer pays the rank\'s trustee rate - the ladder buys nothing again'],
			['economy/PrisonManager.java', /root\.add\("origins", originObj\)/, 'PrisonManager: the way out of prison is not written to the file, so a restart releases a prisoner at the world spawn'],
