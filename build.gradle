			['ModCommands.java', /raidBossHelpList\(\)/, 'ModCommands: the terminal /raidboss help list is written by hand again, so a boss can be added and never listed - which is how the Elder Warden and the Puppeteer were unfindable'],
			['economy/MirageCastleManager.java', /Stand seat = standSpot\(standing, king, kingSeat\)/, 'MirageCastleManager: the King is placed on the throne by hand again, so a taller body or a lower canopy puts him inside the furniture in silence'],
