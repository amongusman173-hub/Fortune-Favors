		// 24) A conflict copy of a source file is a file the compiler is handed, and a duplicate
		//     public class is a hard build failure - not hypothetical: an iCloud-written
		//     `MiningZoneManager 2.java` failed `compileJava` outright with "class
		//     MiningZoneManager is public, should be declared in a file named
		//     MiningZoneManager.java", a sentence about a file nobody had touched. The resource
		//     roots learned this lesson (they exclude and scrub); the Java source sets never did.
		//     Asked of the real source sets, not of a file, because what matters is what Gradle
		//     would actually hand javac.
		[sourceSets.main, sourceSets.client].each { ss ->
			def offenders = ss.java.files.findAll { File f -> ICLOUD_CONFLICT(f.name) }
			if (!offenders.isEmpty()) {
				problems << "${ss.name} source set compiles ${offenders.size()} iCloud conflict copy/copies (${offenders*.name.sort().join(', ')}) - one duplicate public class in there fails the whole build, so exclude them from the source set"
			}
		}

		// 25) Three reworks whose failure mode is invisible in the source: the pit's horde is
		//     supposed to be unarmed (a zombie holding a sword compiles perfectly), the six
		//     bosses in BossManager are supposed to be sweepable after a crash (a body with no
		//     marker is indistinguishable from an honest mob, which is why there was no sweep),
		//     and the fast-mine check is supposed to measure around the connection rather than
		//     through it. Each half that matters is pinned, plus the two regressions that would
		//     silently undo them.
		[
			['economy/PrisonManager.java', /mob\.setCanPickUpLoot\(false\)/, 'PrisonManager: an arena zombie can pick gear up again - a dropped axe is how "no weapons" stops being true'],
			['economy/PrisonManager.java', /setItemSlot\(EquipmentSlot\.MAINHAND, ItemStack\.EMPTY\)/, 'PrisonManager: the arena horde is no longer explicitly empty-handed'],
			['economy/PrisonManager.java', /LEATHER_HELMET/, 'PrisonManager: the arena horde is no longer issued a leather helmet'],
			['economy/PrisonManager.java', /setDropChance\(slot, 0\.0F\)/, 'PrisonManager: the arena horde drops its gear again - an arena that rains leather is an arena with a farm in it'],
			['economy/PrisonManager.java', /ARENA_GATES\[i\]\[0\] \* edge/, 'PrisonManager: the horde no longer comes out of the gates, so it materialises in the sand behind the player'],
			['economy/PrisonManager.java', /ARENA_RING\[\(start \+ step\) % ARENA_RING\.length\]/, 'PrisonManager: a round sends its bodies to one tile again, so a four-body wave reads as one opponent that will not fall over'],
			['economy/PrisonManager.java', /for \(int\[\] gate : ARENA_GATES\)/, 'PrisonManager: the gate frames are no longer built from the same list the spawn points read, so a gate can be opened with no way out of it'],
			['economy/PrisonManager.java', /buildFishingHarbour\(level\)/, 'PrisonManager: the fishing harbour is no longer built with the arena - the two share a bench because the prison world is a void'],
			['economy/BossManager.java', /public static int sweepOrphanBosses\(MinecraftServer server\)/, 'BossManager: the orphan sweep is gone, so a crash between a teardown and a save leaves a marked statue of one of the six with nothing to claim it'],
			['economy/BossManager.java', /markRigged\(entity\)/, 'BossManager: the fight loop no longer marks the bodies it drives, and an unmarked body is exactly the leftover the sweep cannot tell from an honest mob'],
			['economy/BossManager.java', /isRiggedBoss\(mob\) && !bosses\.containsKey/, 'BossManager: the orphan sweep no longer asks whether a marked body has a fight behind it'],
			['economy/BossManager.java', /"boss orphan sweep"/, 'BossManager: the orphan sweep is never called - it exists and never runs, which is the orphaned-statue bug with extra steps'],
			['anticheat/AntiCheat.java', /public static boolean fastBreakFails\(int elapsedTicks, int vanillaTicks, int latencyTicks\)/, 'AntiCheat: fast-mine no longer takes the connection into account, so a laggy spike fails the break and refuses an honest player their block'],
			// The break clock is the server's own tick counter, read at packet time on both ends. It
			// cannot be the level's game time - ServerLevel.tickTime is only true for the overworld,
			// so every other dimension, this server's prison and realms included, has a game time
			// that never advances and measures every break as zero ticks - and it cannot be the tick
			// loop's clock, which is sampled at the tick boundary and lags the handler.
			['anticheat/AntiCheat.java', /(?s)public static long breakClock\(ServerPlayer player\) \{.*?server\.getTickCount\(\)/, 'AntiCheat: the break clock is gone or no longer reads the server tick counter, so every break outside the overworld measures zero ticks and honest mining in this server\'s own dimensions is refused'],
			// And what is measured is the client's own start-to-stop claim, put through the tick-rate
			// correction with the measured latency folded in. The interval to the destroy is not a
			// measurement of the client at all - it is the server's own progress clock, which every
			// start packet resets - and it is what read an honest fist on sand, and a spam clicker,
			// as fast mining.
			['anticheat/AntiCheat.java', /(?s)public static void noteBreakStop\(ServerPlayer player, BlockPos pos\) \{.*?breakClaims\.put\(.*?breakClientTicks\(claim\.lengthTicks\(\), PerfMonitor\.tps\(\)\).*?fastBreakFails\(measured, estimate, ping\)/, 'AntiCheat: the mine check no longer measures the client\'s own start-to-stop claim, in the client\'s own ticks, with the measured latency folded in, so spam clicking and every dimension but the overworld are refused again'],
			['anticheat/AntiCheat.java', /(?s)noteBreakStart\(ServerPlayer player, BlockPos pos, long tick\) \{.*?PACKET_FLOOD/, 'AntiCheat: an overflow of the break-start map is silently cleared again, which lets a client wipe the start of the block it means to break and switch the mine check off'],
			['anticheat/AntiCheat.java', /oreRush\(player, track, state, now\);/, 'AntiCheat: the ore rush is no longer measured at the break, so a body pulling thirty diamonds out of five minutes is never reported'],
			['economy/VanishManager.java', /removeEffectParticles\(\)/, 'VanishManager: the sweep of the synced effect-particle list is gone, so a vanished body syncs its potion cloud to every client in range - the tell this file has claimed to mute since it was written'],
			['economy/VanishManager.java', /hideFromUnpatchableViewers\(p\)/, 'VanishManager: the body is no longer removed from the clients that cannot be patched, so a Bedrock player still watches the moderator walk around'],
			// The held item has to be emptied for real (the packet half cannot hide a body from its own
			// third-person view) and the kit has to be the one thing exempt, or a vanished moderator is
			// holding an item everybody can see or holding a kit nobody can click.
			['economy/VanishManager.java', /SpectateKit\.isKitItem\(/, 'VanishManager: the hands are emptied without exempting the moderation kit, so the kit is parked in the wardrobe and the staff member cannot click the one item it exists for'],
			['economy/VanishManager.java', /EquipmentSlot\.OFFHAND/, 'VanishManager: the off hand is no longer named anywhere, so a shield or a totem stays drawn on an empty body'],
			// The Deep Mine's haul road is on the floor, not in it, and a site will not hand over its own
			// ceiling until it is coming down. Both are one line in a very large file and both were wrong.
			['economy/ExpeditionManager.java', /(?s)BlockPos cell = new BlockPos\(bx \+ lx, fy \+ 1, bz \+ lz\);.*?setIfChanged\(level, cell, rail\)/, 'ExpeditionManager: the Deep Mine rails are written into the floor cell again - a rail laid in the rock it sits on is a rail nobody can see'],
			['economy/ExpeditionManager.java', /disableDrop\(\)/, 'ExpeditionManager: a falling lump of an unstable roof becomes an item again, so the site hands out its own ceiling forty blocks at a time'],
			['economy/ExpeditionManager.java', /rockPaysInNothing\(/, 'ExpeditionManager: the gravel rule is gone, so mining the site\'s own roof is an income the run ledger never priced'],
			// A mark is the tag and the team together, and a release that only empties the team leaves the
			// body glowing white - which is the whole "passively spawned mobs still glow" report.
			['economy/ExpeditionManager.java', /markedBodies/, 'ExpeditionManager: the glow ledger is gone, so a mark released on death alone outlives the run on every persistent body the site left standing'],
			['economy/ExpeditionManager.java', /setGlowingTag\(false\)/, 'ExpeditionManager: the glow is never taken off a body again - only the team is emptied, and a body with the tag and no team glows white'],
			// The guardian's fight, pinned as its own methods: a rework that compiles into "bigger health
			// bar" is exactly the rework this replaced.
			['economy/ExpeditionManager.java', /guardianMoveOrder\(/, 'ExpeditionManager: the floor guardians are back to one attack - a boss with a health bar and no moveset'],
			['economy/ExpeditionManager.java', /guardianTick\(s, sp, ServerClock\.clock\(s\.zoneLevel\)\);/, 'ExpeditionManager: the guardian moveset exists and is never driven, so the fight is the health bar alone']
		].each { entry ->
			File owner = new File(srcRoot, entry[0])
			if (!owner.exists()) {
				problems << "${entry[0]} is gone - ${entry[2]}"
				return
			}
			def ownerText = owner.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(ownerText =~ entry[1])) {
				problems << entry[2]
			}
		}
		// ...and the gear the horde used to be issued must not come back.
		// ...and the gear the horde used to be issued must not come back. Checked inside the
		// method that builds the horde rather than across the file, because this file also holds
		// the prison's sell prices and the sword a prisoner is handed for the pit.
		File prisonSrc = new File(srcRoot, 'economy/PrisonManager.java')
		if (prisonSrc.exists()) {
			def prisonText = prisonSrc.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			def horde = prisonText =~ /(?s)private static Mob arenaMob\(ServerLevel level, int wave\) \{(.*?)\n   \}/
			if (!horde.find()) {
				problems << 'PrisonManager: arenaMob is gone - the horde is built somewhere the audit cannot read, so nothing keeps it unarmed'
			} else {
				def body = horde.group(1)
				[['Items.IRON_SWORD', 'armed'], ['Items.CROSSBOW', 'carrying a crossbow'], ['IRON_CHESTPLATE', 'given an iron chestplate'], ['DIAMOND_HELMET', 'given a diamond helmet']].each { pair ->
					if (body.contains(pair[0])) {
						problems << "PrisonManager: the pit horde is ${pair[1]} again"
					}
				}
				if (body =~ /EntityTypes\.(SPIDER|PILLAGER|WITCH)/) {
					problems << 'PrisonManager: arenaMob spawns something other than a zombie - the horde is meant to be a fist fight'
				}
			}
		}

		// ...and the ore rush has to stay silent to the miner it is about. Scoped to the method body
		// rather than to the file, because this file sends chat to players all over it (a refused
		// placement, a refused break) and a file-wide rule would either match those or have to be
		// written as a rule about nothing.
		if (acFile.exists()) {
			def rushText = acFile.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			def rushBody = rushText =~ /(?s)private static void oreRush\(ServerPlayer player, Track track, BlockState state, long now\) \{(.*?)\n   \}/
			if (!rushBody.find()) {
				problems << 'anticheat/AntiCheat.java no longer has an oreRush method the audit can read, so nothing keeps the x-ray finding away from the miner it is about'
			} else if (rushBody.group(1) =~ /Chat\.|announce|speak/) {
				problems << 'AntiCheat: the ore rush says something to the miner - the alert is meant to reach staff and nobody else, because a cheater who is told they have been caught just changes where they mine'
			}
		}

		// ...and the three things this batch removed must not come back. The list above is "this
		// must be present"; these are the opposite, and they live here rather than in it because
		// "the file does not contain X" cannot be written as "the file contains X". Comments are
		// stripped before the match, for the same reason they are stripped above: a note about why
		// a line is gone must not itself count as the line.
		//
		//   - the fake disconnect line, which told everybody the moment somebody vanished,
		//   - the line that told a player they were being watched, and
		//   - spectator mode for a moderator, who has to be able to open, break and hold.
		[
			['economy/VanishManager.java', /left the game|joined the game/, 'VanishManager: vanish announces itself again, so everybody is told the moment somebody vanishes - the tell the whole feature exists to avoid'],
			['anticheat/AntiCheat.java', /moderator is now watching you/, 'AntiCheat: the spectate tells the player they are being watched again, so it changes their behaviour and measures nothing'],
			['anticheat/AntiCheat.java', /setGameMode\(GameType\.SPECTATOR\)/, 'AntiCheat: spectating puts a moderator back in spectator mode, where they cannot open a chest, break a block or hold the kit'],
			['economy/ServerDisasterManager.java', /state\.is\(Blocks\.TORCH\)/, 'ServerDisasterManager: a torch warms the body again, so a corridor of torches is an answer to the snowstorm'],
			// The reflective sweep, which is the bug this batch is about: `Class.getMethod` returns
			// public members only, `LivingEntity.removeEffectParticles()` is protected, and the call
			// therefore threw into a catch on every tick of every vanish for every release that
			// shipped it. Written as "must not come back" rather than "the invoker must be present",
			// because both can be true at once if somebody adds the invoker and leaves the old line
			// underneath it - and the old line is the one that decides nothing and looks like it does.
			['economy/VanishManager.java', /getMethod\("removeEffectParticles"\)/, 'VanishManager: the potion cloud is swept by reflection again - getMethod cannot see a protected method, so the sweep is a line that runs, does nothing, and reports no failure'],
			// The sidebar's width. A scoreboard is exactly as wide as its longest line, so a phrase
			// that says nothing is a phrase that costs every line on the screen its room.
			['economy/ExpeditionManager.java', /You are in /, 'ExpeditionManager: the sidebar says "You are in ..." again - the panel is as wide as its longest line, so those eleven characters widen every line on the screen']
		].each { entry ->
			File owner = new File(srcRoot, entry[0])
			if (!owner.exists()) {
				problems << "${entry[0]} is gone - ${entry[2]}"
				return
			}
			def ownerText = owner.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (ownerText =~ entry[1]) {
				problems << entry[2]
			}
		}

		// 20) The three things that made a vanished moderator visible anyway, and the one that made
		//     the castle's deadline optional. Each is a mechanism rather than a threshold, so each is
		//     pinned by name, and comments are stripped first so that a sentence describing the fix
		//     cannot stand in for the fix.
		def vanishFile = new File(srcRoot, 'economy/VanishManager.java')
		if (!vanishFile.exists()) {
			problems << 'VanishManager.java is gone - vanish re-asserts nothing'
		} else {
			def vanishCode = vanishFile.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			// The locator bar is a second tab list, and it is the one that shows a position. Invisibility
			// is not part of it: vanilla tracks every body whose WAYPOINT_TRANSMIT_RANGE is positive.
			if (!(vanishCode =~ /untrackWaypoint\(/)) {
				problems << 'VanishManager never drops the vanished body from the locator bar - invisibility does not, so a vanished moderator is a moving dot on everybody\'s screen'
			}
			if (!(vanishCode =~ /trackWaypoint\(/)) {
				problems << 'VanishManager never puts the body back on the locator bar, so an unvanish leaves a ghost marker behind'
			}
			// The items. Held and worn things render by their own layers and neither asks whether the
			// entity is invisible, so the packets are the only thing that hides them.
			if (!(vanishCode =~ /ClientboundSetEquipmentPacket/)) {
				problems << 'VanishManager no longer tells clients the hands and armour are empty - a floating sword over empty air is the loudest tell there is'
			}
			if (!(vanishCode =~ /MobEffects\.GLOWING/)) {
				problems << 'VanishManager stopped stripping glowing - the outline is a separate render pass and survives invisibility'
			}
		}
		// And the locator-bar half of the vanish is a mixin on the one method vanilla asks.
		def vanishMixinFile = new File(srcRoot, 'mixin/LivingEntityMixin.java')
		if (!vanishMixinFile.exists()
			|| !(vanishMixinFile.getText('UTF-8') =~ /isTransmittingWaypoint/)
			|| !(vanishMixinFile.getText('UTF-8') =~ /VanishManager\.isVanished\(/)) {
			problems << 'LivingEntityMixin no longer injects isTransmittingWaypoint and asks about vanish - a player who walks into range after the vanish gets a locator-bar marker again'
		}

		// 21) A fall that only reads as a deadline is not one. The blow at the end of the collapse was
		//     real and enormous, and players still walked out of it, which can only mean a blow that did
		//     nothing; so the outcome is verified rather than assumed, and the enforcement is an
		//     ordinary damage type so that every death rule in the mod still applies to it.
		def mirageFile = new File(srcRoot, 'economy/MirageCastleManager.java')
		if (mirageFile.exists()) {
			def mirageCode = mirageFile.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(mirageCode =~ /swallowed\(before,/)) {
				problems << 'the falling castle no longer checks whether its blow did anything - a swallowed blow leaves players standing in a field where the castle used to be'
			}
			if (!(mirageCode =~ /private static void deadline\(/)) {
				problems << 'MirageCastleManager.deadline is gone - the escape window has nothing behind it'
			}
			if (!(mirageCode =~ /genericKill\(\)/)) {
				problems << 'the castle\'s deadline no longer goes through an ordinary damage type - a death that bypasses the mod\'s own death rules is how a keep-inventory pack gets eaten'
			}
		}

		// 22) The relic is the castle's own rescue, not a second copy of it. Two implementations of
		//     "put them somewhere safe" is two answers, and the day one moves the other is a bug.
		def relicFile = new File(srcRoot, 'economy/LastRemembrance.java')
		if (!relicFile.exists()) {
			problems << 'LastRemembrance.java is gone - the monarch drops a sword that does nothing but swing'
		} else {
			def relicCode = relicFile.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(relicCode =~ /MirageCastleManager\.sendToSpawn\(/)) {
				problems << 'Last Remembrance stopped going through the castle\'s own rescue - the relic and the rescue can drift apart again'
			}
			if (!(relicCode =~ /laterClock\(/)) {
				problems << 'Last Remembrance armed its two cooldowns separately - a twenty-second arc can shorten a five-minute rescue'
			}
			if (!(relicCode =~ /isShiftKeyDown\(\)/)) {
				problems << 'Last Remembrance lost its sneak branch - the ride home and the arc are the same click again'
			}
		}

		// 23) The End's hold is a mixin on the fight's own "I want a dragon", and a mixin that loads
		//     and does nothing is an End where the dragon spawns the moment you walk in - silently,
		//     and in the one place where "was it held?" cannot be seen from the outside.
		def dragonMixin = new File(srcRoot, 'mixin/DragonFightMixin.java')
		if (!dragonMixin.exists()) {
			problems << 'DragonFightMixin is gone - the Ender Dragon spawns the moment the arena loads again'
		} else {
			def dragonMixinCode = dragonMixin.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(dragonMixinCode =~ /EnderDragonManager\.shouldHoldTheDragon\(/)) {
				problems << 'DragonFightMixin never asks EnderDragonManager.shouldHoldTheDragon - the hook loads and does nothing'
			}
			// Matched as the annotation's own target rather than as a bare word, because the javadoc
			// above names the same method - and a rule a comment can satisfy is a rule that does not
			// bite. (Checked the hard way: a typo in the method name passed the loose version.)
			if (!(dragonMixinCode =~ /@Inject\(\s*method = "findOrCreateDragon"/)) {
				problems << 'DragonFightMixin no longer hooks findOrCreateDragon - it is holding something else, or nothing'
			}
			// And the creation itself, because a rematch never goes through findOrCreateDragon: the
			// vanilla respawn animation's last stage calls createNewDragon directly, so a hold on the
			// request alone let every dragon after the first drop out of the sky.
			if (!(dragonMixinCode =~ /@Inject\(\s*method = "createNewDragon"/)) {
				problems << 'DragonFightMixin no longer hooks createNewDragon - the rematch path bypasses the hold and the dragon spawns vanilla-style again'
			}
			if (!(mixinText =~ /"DragonFightMixin"/)) {
				problems << 'DragonFightMixin exists but is not listed in fortuneandfavors.mixins.json - it never loads'
			}
		}

		// 24) The dragon's four promises, pinned by name in the code that makes them: the rift can
		//     be opened, the last stand stops at one heart and only once, the last stand is killable,
		//     crystal healing cannot walk it off the floor, and the death still goes through an
		//     ordinary death so every vanilla consequence of killing a dragon still happens.
		def dragonFile = new File(srcRoot, 'economy/EnderDragonManager.java')
		if (!dragonFile.exists()) {
			problems << 'EnderDragonManager.java is gone - the End is vanilla again'
		} else {
			def dragonCode = dragonFile.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(dragonCode =~ /LAST_STAND_HEALTH = 1\.0F/)) {
				problems << "the dragon's last stand is not pinned at one heart"
			}
			if (!(dragonCode =~ /public static boolean reachesLastStand\(/)) {
				problems << 'the dragon\'s last-stand trigger is gone - the finale either never runs or cannot be turned off'
			}
			if (!(dragonCode =~ /public static boolean reachesDeath\(/)) {
				problems << 'the dragon\'s killing-blow rule is gone - a last-stand dragon may no longer be killable'
			}
			if (!(dragonCode =~ /lastStand && dragon\.getHealth\(\) > LAST_STAND_HEALTH/)) {
				problems << 'the one-heart clamp is gone - a crystal can heal the dragon back off the floor it was just put on'
			}
			// The hold asks the *level* for its dragons, not the fight's memory of them. That is the
			// difference between the rite running for every dragon and the rite running exactly once:
			// a stored uuid is left behind by a dead body, and `hasPreviouslyKilledDragon` used to end
			// the hold for good after the first win - so a rematch spawned vanilla-style with no rift
			// and no arrival, which read as "the rework does not apply and it just spawns normally".
			if (!(dragonCode =~ /end\.getDragons\(\)\.isEmpty\(\)/)) {
				problems << 'the hold no longer asks the End for a live dragon - it can either refuse a fight that already has one or release a rematch that never came through the rift'
			}
			if (!(dragonCode =~ /genericKill\(\)/)) {
				problems << 'the death ceremony no longer ends in an ordinary death - the vanilla death animation, loot and portal may not run'
			}
		}

		// 25) A vanished body leaves nothing behind, and every mute is a mixin that has to keep
		//     asking the one question that identifies it. The old guard was a guess - "invisible,
		//     and not by a potion" - which stopped matching the moment this mod handed out
		//     invisibility effects of its own, and the mutes then stopped firing with no error
		//     anywhere. Asking the marker instead is pinned here, file by file.
		def stepMixin = new File(srcRoot, 'mixin/VanishStepMixin.java')
		def landingMixin = new File(srcRoot, 'mixin/VanishLandingMixin.java')
		def livingMixinFile = new File(srcRoot, 'mixin/LivingEntityMixin.java')
		def stripComments = { File f ->
			f.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
		}
		if (!stepMixin.exists()) {
			problems << 'VanishStepMixin is gone - a vanished moderator has footsteps and kicks up sprint dust again'
		} else {
			def stepCode = stripComments(stepMixin)
			if (!(stepCode =~ /VanishManager\.isHiddenBody\(/)) {
				problems << 'VanishStepMixin stopped asking VanishManager.isHiddenBody - the footsteps and the sprint dust are back for anybody with an invisibility effect'
			}
			if (!(stepCode =~ /spawnSprintParticle/)) {
				problems << 'VanishStepMixin no longer mutes sprint particles - a vanished body kicks dust off the ground'
			}
		}
		if (!landingMixin.exists()) {
			problems << 'VanishLandingMixin is gone - a vanished body throws a puff of block dust every time it lands'
		} else {
			def landingCode = stripComments(landingMixin)
			if (!(landingCode =~ /spawnExtraParticlesOnFall/)) {
				problems << 'VanishLandingMixin no longer touches the landing-dust gate - the puff is back, and cancelling checkFallDamage would have removed fall damage instead'
			}
			if (!(landingCode =~ /VanishManager\.isHiddenBody\(/)) {
				problems << 'VanishLandingMixin never asks VanishManager.isHiddenBody - the hook loads and mutes the dust for everybody'
			}
			if (!(mixinText =~ /"VanishLandingMixin"/)) {
				problems << 'VanishLandingMixin exists but is not listed in fortuneandfavors.mixins.json - it never loads'
			}
		}
		if (livingMixinFile.exists()) {
			def livingCode = stripComments(livingMixinFile)
			if (!(livingCode =~ /updateSynchronizedMobEffectParticles/)) {
				problems << 'the potion-cloud mute is gone from LivingEntityMixin - a vanished body walks around inside a labelled cloud'
			}
			if (!(livingCode =~ /VanishManager\.isHiddenBody\(/)) {
				problems << 'LivingEntityMixin no longer distinguishes our vanish from an invisibility potion'
			}
		}

		// 26) The dragon's arrival and its lance: the bar counts up (never from zero, which is a
		//     corpse), the beam lasts rather than flashing, and what it leaves on the ground is
		//     vanilla's own dragon-breath cloud under a cap. Each of these is one line away from
		//     being a firework, a scorch mark, or thirty clouds ticking in one chunk.
		if (dragonFile.exists()) {
			def dragonBody = stripComments(dragonFile)
			if (!(dragonBody =~ /public static float riseHealth\(/)) {
				problems << "the dragon's arrival no longer has one arithmetic behind its bar - the count-up and anything that reads it can disagree"
			}
			if (!(dragonBody =~ /RISE_FLOOR/)) {
				problems << 'the arrival can start at zero health, which is a dead dragon rather than a bar filling'
			}
			if (!(dragonBody =~ /setCustomParticle\(PowerParticleOption\.create\(ParticleTypes\.DRAGON_BREATH/)) {
				problems << "the breath lance no longer leaves vanilla's own dragon-breath cloud - the pool is something players have never seen before"
			}
			if (!(dragonBody =~ /BEAM_POOLS_MAX/)) {
				problems << 'the breath pools are uncapped - a long lance can carpet a chunk'
			}
			if (!(dragonBody =~ /private static void tickBeam\(/)) {
				problems << 'the breath lance has no tick - it is a move that lands once and leaves nothing'
			}
			if (!(dragonBody =~ /clearPools\(\);/)) {
				problems << 'nothing clears the breath pools - damage on the ground with no fight left to attribute it to'
			}
			// The VFX kit and the ambient layer. The rules are here rather than in a comment because
			// "the dragon looks incredible" is exactly the claim that quietly rots: one refactor moves
			// a nova call out of an impact and the fight goes back to being arithmetic with smoke in it.
			if (!(dragonBody =~ /private static void nova\(/)) {
				problems << "the dragon's nova kit is gone - every impact is back to being a single ring of particles"
			}
			if (!(dragonBody =~ /private static void flash\(/)) {
				problems << "the dragon's screen flash is gone - the big blows no longer light the room"
			}
			if (!(dragonBody =~ /private static void aura\(/)) {
				problems << 'the ambient aura is gone - the dragon is invisible between its moves'
			}
			if (!(dragonBody =~ /aura\(end, dragon, rotationPhase\(\)\);/)) {
				problems << 'nothing calls the aura - it exists and never runs'
			}
			for (String move : ['ENDER_LASH', 'VOID_COLLAPSE', 'CRYSTAL_BLOOM', 'END_ECLIPSE', 'ABYSSAL_ROAR',
					'DRAGON_FIREBALL', 'END_SHOCKWAVE', 'LOST_PROTECTORS', 'AURA_OF_THE_END', 'VOID_DIVE', 'STARFALL',
					'DRAGON_CHARGE', 'ENDER_FANGS', 'SOUL_VORTEX', 'VOID_GRASP', 'METEOR_SHOWER', 'SUPERNOVA',
					'SLAM', 'END_ROD_SPIKES', 'SHULKER_BULLETS', 'ZERO_GRAVITY', 'SKY_RING', 'ASCENDANT_BLINK']) {
				if (!(dragonBody =~ /${move}\(/)) {
					problems << "the dragon has lost the ${move} move entirely"
				}
				if (!(dragonBody =~ /case ${move} ->/)) {
					problems << "${move} is in the rotation but has no shape or no impact behind it"
				}
			}
		}

		// 27) The dragon does not wind up, and it does not draw without a budget. Both of those are
		//     one line away from being untrue and neither of them shows up as a crash: a restored
		//     telegraph is a fight that tells you what is coming a second early, and a particle drawn
		//     straight from the level is a tick the ceiling never sees. So the second one is checked
		//     by its absence - there is no `end.sendParticles(` left in the file at all, because the
		//     only sender is the one that spends against the budget.
		if (dragonFile.exists()) {
			def dragonFx = stripComments(dragonFile)
			if (!(dragonFx =~ /WIND_UP_TICKS = 0/)) {
				problems << 'the dragon winds up again - WIND_UP_TICKS is no longer zero'
			}
			if (dragonFx =~ /shortestTelegraph\(/) {
				problems << 'the telegraph arithmetic is back in the dragon - the fight is announcing its moves again'
			}
			if (!(dragonFx =~ /PARTICLE_CEILING = [0-9]+/)) {
				problems << "the dragon's particle budget is gone - the loudest fight in the mod is unbounded again"
			}
			if (!(dragonFx =~ /private static void spend\(/)) {
				problems << 'the particle spender is gone - the ceiling is a number nothing reads'
			}
			if (dragonFx =~ /end\.sendParticles\(/) {
				problems << 'a particle is drawn straight from the level in EnderDragonManager - it never goes through the budget'
			}
			if (!(dragonFx =~ /beginParticleTick\(\);/)) {
				problems << 'nothing opens the particle budget each tick - the ceiling would apply to the server\'s whole life'
			}
			if (!(dragonFx =~ /isAnAllowedProtectorTarget\(/)) {
				problems << 'the protector targeting rule is gone - a summon can target the dragon and the boss kills itself'
			}
			if (!(dragonFx =~ /public static boolean isFightActive\(/)) {
				problems << 'the fight-active rule is gone - the pocket watch and any future item have nothing to ask'
			}
			// The fight with no captions, and a soundtrack that belongs to the fight rather than to
			// the arrival. Both are one line away from being untrue and neither shows up as a crash: a
			// restored title is a caption over a boss, and a theme started only by the arrival is a
			// friend who joins the fight late, and a server that restarts mid-flight, hearing nothing.
			if (dragonFx =~ /chosen\.label\(/) {
				problems << 'the action bar names the move again - the fight is narrated rather than fought'
			}
			if (dragonFx =~ /private static void showTitle\(/) {
				problems << 'a general-purpose title helper is back in the dragon fight - that is how the phase and move captions returned the first time'
			}
			['IT KNOWS', 'IT LANDS', '&lONE HEART',
				'IT IS COMING APART', 'IT IS DRINKING YOU'].each { caption ->
				if (dragonFx.contains(caption)) {
					problems << "the dragon fight has a caption back (${caption}) - the move and death captions are meant to be gone"
				}
			}
			// The phase banner is the one caption the fight is allowed, on the action bar and with
			// phase one deliberately silent. Both halves are one line away from being untrue.
			if (!(dragonFx =~ /public static String phaseBanner\(/)) {
				problems << 'the phase banner is gone - a border is crossed with nothing to read'
			}
			if (!(dragonFx =~ /phaseBanner\(next\)/)) {
				problems << 'nothing calls phaseBanner - the banner exists and no border shows it'
			}
			// The boss bar is the fight's own vanilla event, reached through an accessor: without
			// the accessor it stays vanilla, and without dressBar nothing dresses it.
			if (!(dragonFx =~ /private static void dressBar\(/)) {
				problems << 'dressBar is gone - the dragon boss bar has no phase colour and no smooth drain'
			}
			if (!(mixinText =~ /"DragonFightAccessor"/)) {
				problems << 'DragonFightAccessor is not listed in the mixin config - the boss bar accessor never loads'
			}
			// The End's two natives never target each other, enforced where a target is adopted.
			if (!(dragonFx =~ /public static boolean endNativeTruce\(/)) {
				problems << 'endNativeTruce is gone - the dragon and the endermen can turn on each other again'
			}
			def mobMixinFile = new File(srcRoot, 'mixin/MobMixin.java')
			if (!mobMixinFile.exists() || !(stripComments(mobMixinFile) =~ /EnderDragonManager\.endNativeTruce\(/)) {
				problems << 'MobMixin no longer asks endNativeTruce - the truce exists and nothing enforces it'
			}
			if (!(dragonFx =~ /ensureTheme\(end, found\);/)) {
				problems << 'nothing re-arms the theme after the arrival - a late arrival and a restart both get silence'
			}
			if (!(dragonFx =~ /themeShouldRun\(/)) {
				problems << 'the rule for whether the fight has music is gone - the theme can be started for nothing or never'
			}
			if (!(dragonFx =~ /shouldServeTheme\(/)) {
				problems << 'nothing asks per player whether they still need the theme - a late arrival is never handed it'
			}
			if (!(dragonFx =~ /crystalAura\(end, dragon\);/)) {
				problems << 'nothing ticks the crystals - they are back to being scenery that heals the dragon twice a fight'
			}
			if (!(dragonFx =~ /dragonAura\(end, dragon, rotationPhase\(\)\);/)) {
				problems << "the dragon's own aura is not ticked - melee has no cost and the body is not a place"
			}
			if (!(dragonFx =~ /crystalHealAllowed\(/)) {
				problems << 'nothing asks whether a script owns the health bar before the crystals feed the dragon'
			}
			// The crystal roster, the raised bar, and the two lasting moves from the pack this fight
			// borrows from. Each of these is a single call site, which is exactly what a refactor removes
			// without noticing that the behaviour went with it - a roster nobody rolls for is ten plain
			// crystals, a bar nobody raises is a two-hundred-health boss with a three-hundred-health
			// fight inside it, and a slam nobody ticks is a body stuck in a dive.
			if (!(dragonFx =~ /tickCrystalRoster\(end\);/)) {
				problems << 'the crystal roster is never swept - a destroyed crystal keeps its roll and its cursed blast never lands'
			}
			if (!(dragonFx =~ /clearCrystalRoster\(\);/)) {
				problems << 'the crystal roster is never cleared - the next fight inherits the last fight\'s crystals, including a crown'
			}
			if (!(dragonFx =~ /private static CrystalKind kindOf\(/)) {
				problems << 'the crystal types are never rolled - every crystal in the ring is the plain one again'
			}
			if (!(dragonFx =~ /crystalTierCeiling\(/)) {
				problems << 'the crystal roster\'s ladder is gone, so the ring no longer gets worse as the fight does'
			}
			if (!(dragonFx =~ /public static boolean onCrystalDamage\(/)) {
				problems << 'the crystal damage gate is gone - the forcefield eats nothing and the crown does not hold'
			}
			// ...and the crown's answer has to keep coming from one place. The roster map alone would
			// hold a crown that has since been destroyed - a ring nobody could ever open - so the
			// standing list is the level's, through one accessor, with one seam for the check.
			if (!(dragonFx =~ /standingForCrown\(/)) {
				problems << 'the crown rule no longer reads the standing crystals from the level - it can hold a ring for a crystal that is already gone'
			}
			if (!(dragonFx =~ /setStandingCrystalsForTest\(/)) {
				problems << 'the standing-list seam is gone, so the check that pins the crown is testing an empty ring'
			}
			if (!(dragonFx =~ /DRAGON_HEALTH = 350\.0F/)) {
				problems << 'the dragon no longer fights with three hundred and fifty health'
			}
			if (!(dragonFx =~ /PHASE_TWO_AT = 2\.0F \/ 3\.0F/) || !(dragonFx =~ /PHASE_THREE_AT = 1\.0F \/ 3\.0F/)) {
				problems << 'the phase borders are no longer the two third-marks - the three phases are not equal thirds of the bar'
			}
			// The rematch is a ceremony - the island reels, the crystals relight one by one, the body
			// climbs - and every one of those three is easy to lose: a ceremony nothing ticks, a
			// ceremony nothing starts, a climb that is a teleport, or a ring lit in one go.
			if (!(dragonFx =~ /if \(respawnTicks > 0\) \{/) || !(dragonFx =~ /private static void tickRespawn\(ServerLevel end, EnderDragon dragon\)/)) {
				problems << 'the rematch ceremony is never ticked - the island stops reeling and the body appears'
			}
			if (!(dragonFx =~ /beginRespawnCeremony\(found\)/)) {
				problems << 'nothing starts the rematch ceremony on a new body, so a rematch is a vanilla spawn again'
			}
			if (!(dragonFx =~ /awaitingRematch = true;/)) {
				problems << 'the dragon no longer records that a rematch is owed - the ceremony has nothing to attach to'
			}
			if (!(dragonFx =~ /relightCrystal\(end, lit - 1\)/)) {
				problems << 'the crystals no longer relight one by one - the ring snaps on all at once'
			}
			if (!(dragonFx =~ /applyDragonHealth\(/)) {
				problems << 'nothing applies the dragon\'s health as an attribute - the bar, the phases and the arrival can disagree'
			}
			if (!(dragonFx =~ /if \(slamTicks > 0\) \{/) || !(dragonFx =~ /if \(zeroGTicks > 0\) \{/)) {
				problems << 'the lasting moves are not ticked - a slam leaves the dragon in a dive and the room weightless'
			}
			// The three the pack's transitions brought, each pinned by its one call site and by the
			// one call site that must exist for it to mean anything: a ring or a chain nobody ticks
			// is a state that never ends, and an ascension nobody starts is a border that is only a
			// flash - while an ascension nobody refuses damage in is an invulnerability with no clock.
			[
				[/tickSkyRing\(end, dragon\);/, 'the sky ring is never ticked - the bands stop closing in and the state never ends'],
				[/tickBlinkChain\(end, dragon\);/, 'the blink chain is never ticked - the dragon is left wherever it last blinked'],
				[/tickAscension\(end, dragon\);/, 'the ascension is never ticked - the border is a flash again rather than a beat'],
				[/beginAscension\(end, dragon\);/, 'nothing starts the ascension at a phase border, so the transition is instantaneous again'],
				[/if \(ascensionTicks > 0\) \{/, 'the ascension no longer refuses blows, so the beat it exists to be is a free hit instead'],
				[/stopLastingMoves\(\);/, 'nothing stops the lasting moves - a ring, a chain or an ascension can be left running with no fight behind it'],
				[/private static void stopLastingMoves\(/, 'the one place the lasting moves are stopped is gone, so each call site is doing it by hand again']
			].each { pair ->
				if (!(dragonFx =~ pair[0])) {
					problems << pair[1]
				}
			}
			['skyRingTicksLeft', 'blinkChainTicksLeft', 'ascensionTicksLeft', 'skyRingSpanForTest',
				'skyRingStepForTest', 'blinkStepsForTest', 'ascensionBeatForTest'].each { accessor ->
				if (!(dragonFx =~ /public static [A-Za-z0-9_.<>\[\]]+ ${accessor}\(/)) {
					problems << "EnderDragonManager.${accessor}() is gone - the lasting move it reports can no longer be pinned by the self-test"
				}
			}
			if (!(dragonFx =~ /private static void spikeField\(/) || !(dragonFx =~ /summonShulkerBullets\(end, dragon\)/)) {
				problems << 'the spikes or the bullets are gone, so a full sky no longer falls back to spikes'
			}
			if (!(mixinText =~ /"DragonFightMixin"/)) {
				problems << 'DragonFightMixin is not listed in the mixin config - the arrival hold never loads'
			}
		}

		// 28) The theme is a file, a sound id and a toast, and all three have to be on disk: the pack
		//     is what a server operator installs (and what the mod stages as its always-on pack), the
		//     sounds.json is what makes the file nameable, and the advancement is the now-playing
		//     toast - hidden, so it never becomes a permanent line in anybody's advancement screen.
		def modSoundsFile = new File(srcRoot, 'ModSounds.java')
		def modSoundsText = modSoundsFile.exists() ? modSoundsFile.getText('UTF-8') : ''
		def themeOgg = new File(projectDir, 'resourcepack/assets/fortuneandfavors/sounds/ender_dragon_theme.ogg')
		def themeSounds = new File(projectDir, 'resourcepack/assets/fortuneandfavors/sounds.json')
		if (!themeOgg.exists() || themeOgg.length() < 100000) {
			problems << 'the Ender Dragon theme is missing from the art pack (or is an empty placeholder) - the boss fight has no music'
		}
		if (!themeSounds.exists() || !(themeSounds.getText('UTF-8') =~ /ender_dragon_theme/)) {
			problems << "the art pack's sounds.json does not name ender_dragon_theme - the ogg ships and nothing can play it"
		}
		if (!(modSoundsText =~ /ENDER_DRAGON_THEME/)) {
			problems << 'ModSounds has no ENDER_DRAGON_THEME event - the theme cannot be played by packet'
		}
		def themeAdvancement = new File(projectDir, 'src/main/resources/data/fortuneandfavors/advancement/technical/ender_theme.json')
		if (!themeAdvancement.exists()) {
			problems << 'the now-playing advancement is gone - the theme plays with nothing saying so'
		} else {
			def toast = themeAdvancement.getText('UTF-8')
			if (!(toast =~ /"show_toast": true/)) {
				problems << 'the now-playing advancement does not show a toast'
			}
			if (!(toast =~ /"hidden": true/)) {
				problems << 'the now-playing advancement is not hidden - it appears in every player\'s advancement screen'
			}
		}

		// 28b) The reworked Wither's theme is the same shape of thing, but cut into three: a summon,
		//      a looped body and a death. All three cuts have to be in the pack, named in
		//      sounds.json and backed by an event - and the hand-off is the easiest piece to lose to
		//      a refactor, so the wire through the fight is checked too, not just the files.
		def witherCuts = [
			['withered_intro', 'WITHERED_INTRO'],
			['withered_loop', 'WITHERED_LOOP'],
			['withered_death', 'WITHERED_DEATH']
		]
		witherCuts.each { name, event ->
			def ogg = new File(projectDir, "resourcepack/assets/fortuneandfavors/sounds/${name}.ogg")
			if (!ogg.exists() || ogg.length() < 50000) {
				problems << "the Wither theme's ${name} cut is missing from the art pack (or is an empty placeholder) - the reworked fight has a hole in its soundtrack"
			}
			if (!themeSounds.exists() || !(themeSounds.getText('UTF-8') =~ /"${name}"/)) {
				problems << "the art pack's sounds.json does not name ${name} - that cut ships and nothing can play it"
			}
			if (!(modSoundsText =~ /${event}/)) {
				problems << "ModSounds has no ${event} event - that cut of the Wither's theme cannot be played by packet"
			}
		}
		[
			new File(srcRoot, 'net/FfMusicPayload.java'),
			new File(srcRoot, 'economy/WitherMusic.java'),
			new File(projectDir, 'src/client/java/com/fortuneandfavors/client/WitherMusic.java')
		].each { file ->
			if (!file.exists()) {
				problems << "${file.name} is gone - the Wither's theme is missing the piece that carries, fades, crossfades or loops it"
			}
		}
		def witherManager = new File(srcRoot, 'economy/WitherReworkManager.java')
		if (witherManager.exists()) {
			def witherText = stripComments(witherManager)
			['WitherMusic.start(', 'WitherMusic.tick(', 'WitherMusic.stop('].each { wire ->
				if (!(witherText =~ /${java.util.regex.Pattern.quote(wire)}/)) {
					problems << "WitherReworkManager never calls ${wire} - a piece of the theme's wiring is dead, so the music starts or stops in the wrong places"
				}
			}
		}
		// 28b-ii) The one line of the client player that is invisible in review and fatal in play:
		//      a cut is born at a NON-ZERO volume, on the MUSIC source. SoundEngine.play refuses a
		//      sound whose computed volume is zero - unless it is MUSIC or opts into canStartSilent()
		//      - and a refused sound is never registered as tickable, so its tick() never runs and
		//      its volume never leaves the floor. A cut that starts at exactly zero is a cut that
		//      never starts, which is "the wither music does not play" as a build failure.
		def clientWitherMusic = new File(projectDir, 'src/client/java/com/fortuneandfavors/client/WitherMusic.java')
		if (clientWitherMusic.exists()) {
			def clientMusicText = stripComments(clientWitherMusic)
			if (!(clientMusicText =~ /this\.volume = SILENT_FLOOR/)) {
				problems << 'the client Wither theme no longer starts its cuts at a non-zero floor - the sound engine refuses a zero-volume cut, never ticks it, and the theme is silent'
			}
			if (!(clientMusicText =~ /SoundSource\.MUSIC/)) {
				problems << "the client Wither theme is not on SoundSource.MUSIC - the engine will not start an inaudible cut on any other source, so it is refused before it can fade in"
			}
		}

		// 28b-iii) The End's opening theme is a file, an event, a command and two wiring points, and
		//      every one of them can go missing without a sound: the pack carries the ogg (a server
		//      operator installs that pack), sounds.json is what makes the file nameable, ModSounds is
		//      what the mod plays by id, and the cue is started - and faded out - by the one tick that
		//      watches the dragon. A rename on any one of the four is music that ships and never plays.
		def introOgg = new File(projectDir, 'resourcepack/assets/fortuneandfavors/sounds/aria_math_epic.ogg')
		if (!introOgg.exists() || introOgg.length() < 50000) {
			problems << "the End's opening theme is missing from the art pack (or is an empty placeholder) - a first walk into the End is silent"
		}
		if (!(themeSounds.exists() && (themeSounds.getText('UTF-8') =~ /"aria_math_epic"/))) {
			problems << "the art pack's sounds.json does not name aria_math_epic - the ogg ships and nothing can play it"
		}
		if (!(modSoundsText =~ /ARIA_MATH_EPIC/)) {
			problems << 'ModSounds has no ARIA_MATH_EPIC event - the End\'s opening theme cannot be played by packet'
		}
		[
			new File(srcRoot, 'net/FfEndIntroPayload.java'),
			new File(srcRoot, 'economy/EndIntroMusic.java'),
			new File(projectDir, 'src/client/java/com/fortuneandfavors/client/EndIntroMusic.java'),
			new File(projectDir, 'src/client/java/com/fortuneandfavors/client/OneShotTrack.java')
		].each { file ->
			if (!file.exists()) {
				problems << "${file.name} is gone - the End's opening theme is missing the piece that carries, fades or plays it"
			}
		}
		//      ... and the cue hangs off the tick that watches the dragon, because "it never plays" and
		//      "it plays over the fight" are the same line missing from the same place.
		//      `dragonFile` is the one declared with the fight's own section above - one File per source.
		if (dragonFile.exists() && !(stripComments(dragonFile) =~ /EndIntroMusic\.tick\(end, found != null\)/)) {
			problems << "the dragon tick no longer greets a first visit or fades the cue when a dragon appears - the End's opening theme either never plays or plays over the fight"
		}
		// 28b-iv) The one line of the one-shot player that is invisible in review and fatal in play, for
		//      both of the cues that share it: a cut is born at a NON-ZERO volume, on the MUSIC source.
		//      SoundEngine.play refuses a sound whose computed volume is zero - unless it is MUSIC or
		//      opts into canStartSilent() - and a refused sound is never registered as tickable, so its
		//      tick() never runs and its volume never leaves the floor. A cut that starts at exactly
		//      zero is a cut that never starts, which is "the credits do not play" as a build failure.
		//      It is also the only place a one-shot could pick up a loop, which would turn a cue into a
		//      soundtrack.
		def oneShotTrack = new File(projectDir, 'src/client/java/com/fortuneandfavors/client/OneShotTrack.java')
		if (oneShotTrack.exists()) {
			def oneShotText = stripComments(oneShotTrack)
			if (!(oneShotText =~ /this\.volume = SILENT_FLOOR/)) {
				problems << 'the one-shot music player no longer starts its cut at a non-zero floor - the sound engine refuses a zero-volume cut, never ticks it, and every one-shot cue is silent'
			}
			if (!(oneShotText =~ /SoundSource\.MUSIC/)) {
				problems << 'the one-shot music player is not on SoundSource.MUSIC - the engine will not start an inaudible cut on any other source, so it is refused before it can fade in'
			}
			if (!(oneShotText =~ /this\.looping = false/)) {
				problems << 'the one-shot music player loops - a cue with a loop in it is a soundtrack that never ends'
			}
		}

		// 28c) Free the End is the game's advancement, not the mod's, so it is overridden to be a
		//      grand (challenge) achievement and handed to everyone who helped instead of only the
		//      killing blow. Both halves are easy to forget: without the override the fight ends on
		//      a plain task again, and without the grant the helpers still walk away with nothing.
		def freeTheEnd = new File(projectDir, 'src/main/resources/data/minecraft/advancement/end/kill_dragon.json')
		if (!freeTheEnd.exists()) {
			problems << 'the Free the End override is gone - the End\'s achievement is a plain task again'
		} else if (!(freeTheEnd.getText('UTF-8') =~ /"frame": "challenge"/)) {
			problems << 'Free the End is no longer a challenge - the grand achievement the fight is supposed to end on is a task'
		}
		def dragonManager = new File(srcRoot, 'economy/EnderDragonManager.java')
		if (dragonManager.exists() && !(stripComments(dragonManager) =~ /Advancements\.grant\(helper, FREE_THE_END\)/)) {
			problems << 'EnderDragonManager no longer grants Free the End to the fight\'s helpers - only the player the killing blow named gets it'
		}
		if (dragonManager.exists() && !(stripComments(dragonManager) =~ /public static int grantFreeTheEnd\(/)) {
			problems << 'EnderDragonManager no longer has grantFreeTheEnd - the achievement has no single place it is handed out from'
		}
		//      ... and the grant hangs off the dragon's DEATH, not just the fight's ceremony. The
		//      reworked death spends the killing blow as a scripted genericKill, so vanilla's
		//      player_killed_entity trigger can never fire; a dragon killed any other way (a rematch,
		//      the rework off, /kill) would leave everyone with nothing.
		def freeTheEndEvents = new File(srcRoot, 'ModEvents.java')
		if (!(freeTheEndEvents.exists() && (stripComments(freeTheEndEvents) =~ /EnderDragonManager\.onDragonDeath\(/))) {
			problems << "the Free the End grant is not wired to the dragon's death event - a dragon that dies without the rework's ceremony ends on an achievement nobody receives"
		}

		// 28d) The summoning is answered by the vanilla fight's own state, not by this class's
		//      memory. The memory is a field, and a field is empty again after every reload - so a
		//      rift gated on it alone replays the whole arrival over a fight that is already won or
		//      already running, which is exactly what re-entering the End used to do. The rift has to
		//      ask the same question the hold asks, and that question is the only gate that survives
		//      a world reload.
		if (dragonManager.exists()) {
			def middleText = stripComments(dragonManager)
			int middleAt = middleText.indexOf('private static void watchForTheMiddle')
			if (middleAt < 0) {
				problems << 'EnderDragonManager no longer has watchForTheMiddle - the rift has no gate at all'
			} else if (!(middleText.substring(middleAt, Math.min(middleText.length(), middleAt + 2400)) =~ /shouldHoldTheDragon\(end\)/)) {
				problems << 'the rift no longer asks whether vanilla is still waiting for its dragon - re-entering the End replays the summoning over a fight that is already won or already running'
			}
		}

		// 28e) A boss theme takes the room's music - all of it. Two sources, because music in this
		//      game is split across them (the game's own score on MUSIC, a record on RECORDS), and a
		//      claim refreshed by every tick of its fight. The two invisible failures: claiming only
		//      one source (the theme plays over the other), and sending the stop AFTER the theme was
		//      started (the claim silences the boss theme itself), which is why the claim is made
		//      before the cut is served and not after it.
		def bossMusic = new File(srcRoot, 'economy/BossMusic.java')
		if (!bossMusic.exists()) {
			problems << 'BossMusic.java is gone - a boss theme plays over the game soundtrack and the backpack boombox again'
		} else {
			def bossMusicText = stripComments(bossMusic)
			['public static void takeOver(', 'public static void tick(', 'SoundSource.MUSIC', 'SoundSource.RECORDS'].each { needle ->
				if (!(bossMusicText =~ /${java.util.regex.Pattern.quote(needle)}/)) {
					problems << "BossMusic no longer has ${needle} - the take-over is not silencing every source music can live on"
				}
			}
		}
		if (dragonManager.exists() && !(stripComments(dragonManager) =~ /BossMusic\.takeOver\(/)) {
			problems << "the End's theme no longer claims the room's music - the dragon fight plays over whatever else is running"
		}
		def witherMusicFile = new File(srcRoot, 'economy/WitherMusic.java')
		if (witherMusicFile.exists() && !(stripComments(witherMusicFile) =~ /BossMusic\.takeOver\(/)) {
			problems << "the Wither's theme no longer claims the room's music - the fight plays over whatever else is running"
		}
		if (!(freeTheEndEvents.exists() && (stripComments(freeTheEndEvents) =~ /BossMusic\.tick\(/))) {
			problems << "no server tick drives BossMusic - a claim that is never ticked down never hands the music back, so every boombox stays hushed forever"
		}
		def jukeboxPayload = new File(srcRoot, 'net/FfJukeboxPayload.java')
		if (!(jukeboxPayload.exists() && (stripComments(jukeboxPayload) =~ /ACTION_STOP_ALL/))) {
			problems << 'the jukebox payload has no stop-everything action - a boss theme cannot reach a client that heals its own music back on the next tick'
		}

		// 28f) The dragon's last batch of answers, each one a single line away from being untrue: the
		//      slam is aimed at a player rather than at the floor it happened to be over, the ram
		//      flies the body into whoever it picked, falling into the void is a rescue rather than a
		//      lost run, and the mace - the one weapon built around a single enormous blow - is
		//      answered with 30% of itself so a smash cannot skip the phases and the ceremony.
		if (dragonManager.exists()) {
			def dragonAnswers = stripComments(dragonManager)
			if (!(dragonAnswers =~ /DRAGON_RAM\("Dragon Ram"/)) {
				problems << 'the dragon has lost the ram - nothing flies the body into the player it picked'
			}
			if (!(dragonAnswers =~ /isVoidRescue\(/)) {
				problems << 'the void-rescue rule is gone - a fall through the End has no arithmetic behind it'
			}
			if (!(dragonAnswers =~ /VOID_RESCUE_HEALTH/)) {
				problems << 'the void rescue is gone - falling off the End island is a lost run again'
			}
			if (!(dragonAnswers =~ /void tickVoidRescue\(/)) {
				problems << 'nothing ticks the void rescue - the rule exists and a fall still kills'
			}
		}
		def combatBalanceMixin = new File(srcRoot, 'mixin/CombatBalanceMixin.java')
		if (combatBalanceMixin.exists() && !(stripComments(combatBalanceMixin) =~ /isMaceBlow\(/)) {
			problems << 'the dragon no longer shrugs off the mace - one smash skips the whole fight'
		}

		// 28g) The seven mechanics the second pass added, each pinned on the line that makes it true
		//      rather than on the label: the rift has a cap AND an expiry (either one alone is the
		//      bug), the tear is visual only so the island survives it, the nova is spendable once,
		//      and the perch is driven off vanilla's own phase machine rather than a move.
		//
		//      Written as a table of (blob, symbol, what-breaking-it-means) rather than as a page of
		//      ifs, because fourteen near-identical lines is exactly the shape that stops being read.
		//      Cleaned up before it is used: one File per source, made here rather than at each of
		//      the four sections that read them.
		def forgeOps = new File(srcRoot, 'economy/ForgeOps.java')
		def enderGear = new File(srcRoot, 'economy/EnderGear.java')
		def modEventsFile = new File(srcRoot, 'ModEvents.java')
		def pinned = { blob, list ->
			list.each { entry ->
				if (!blob.contains(entry[0])) {
					problems << entry[1]
				}
			}
		}
		if (dragonManager.exists()) {
			pinned(stripComments(dragonManager), [
				['END_RIFT_MAX', 'the End Rift lost its hard cap - a long fight can cover the island in rifts'],
				['END_RIFT_TICKS', 'the End Rift no longer expires - rifts would be permanent'],
				['tickEndRifts(', 'nothing ticks the End Rifts - they exist and never pull, never fire and never close'],
				['tickGaze(', 'nothing ticks the Ender Gaze - the beam exists and never follows anyone'],
				['startVoidMarks(', 'the Void Mark is gone - nothing counts down on a player before it explodes'],
				['tickRupture(', 'nothing ticks the End Rupture - the cracks are drawn and never erupt'],
				['Blocks.AIR.defaultBlockState(), 3)', 'the Temporal Tear no longer hides its blocks visually - the island can be permanently damaged by it'],
				['clearLastingMoves(', 'nothing clears the lasting moves - a tear can outlive the fight that made it'],
				['if (!novaSpent)', 'the End Nova is no longer once a fight - a rotation that can roll it twice decides the fight by luck'],
				['novaSpent = false;', 'the nova charge is never handed back - a respawned dragon fights without its major attack'],
				['startPerch(end, dragon);', 'the phase-one perch is not driven off the dragon actually landing'],
				['public static int riftsStanding(', 'the standing-rift count is gone - the cap is no longer readable by a check'],
			])
		}

		// 28h) The Ender Dragon's own set. The two materials are handed to EVERY player in the End
		//      off the death (not off a loot table, which this fight's scripted killing blow can never
		//      feed), the forge assembles the three weapons from them, and each weapon has the ability
		//      its lore promises. Each pin is one line that a refactor could delete in silence.
		if (dragonManager.exists()) {
			pinned(stripComments(dragonManager), [
				['public static int grantEndLoot(', 'the Ender Dragon no longer hands out the End set loot'],
				['heartOfTheEnd()', "the Ender Dragon no longer drops the Heart of the End - the set's three weapons are unobtainable"],
				['DRAGON_SCALE_DROP', 'the dragon no longer drops five Dragon Scales per player'],
				['END_LOOT_GIVEN', 'the End loot grant is not idempotent - the two callers on one death hand out two hearts each'],
			])
		}
		if (forgeOps.exists()) {
			pinned(stripComments(forgeOps), [
				['assembleEnderWeapon(', 'the End set can no longer be assembled in the Item Forge - the Heart and the Scales have nothing to make'],
				['END_SCALE_COST = 5', 'the End set no longer asks for five Dragon Scales - one scale buys a legendary'],
				['readEndMaterials(', 'the End crafts no longer read their material out of the slots - a slot can hold anything and still be spent'],
				['takeEndMaterials(materialSlots, END_HEART_COST, END_SCALE_COST)', 'the assembly no longer spends exactly one Heart and five Scales'],
				['isEnderBaseWeapon(legendary) && holdsEndMaterial(', 'the End assembly no longer runs before the rune branch - the Heart is refused as if it were a rune'],
				// The awakened tier: a separate craft, priced in two more dragons, that must keep
				// running before the rune branch and must refuse an unawakenable weapon rather than
				// eat the materials.
				['upgradeEnderWeapon(', 'the End set lost its awakened tier - the three weapons cannot be reforged'],
				['ModItems.isEnderLegendary(legendary) && holdsEndMaterial(', 'the End upgrade no longer runs before the rune branch - a Voidfang is refused as if it were a rune'],
				['END_AWAKENED_HEART_COST = 1', 'awakening no longer costs one Heart of the End'],
				['END_AWAKENED_SCALE_COST = 5', 'awakening no longer costs five Dragon Scales'],
				['ModItems.isAnyEnderLegendary(legendary)', 'recycling no longer recognises the awakened tier - an upgraded weapon cannot be broken back down'],
			])
		}
		if (!enderGear.exists()) {
			problems << 'EnderGear is gone - the End set has three weapons with no abilities'
		} else {
			pinned(stripComments(enderGear), [
				['VOID_HUNGER_MARKS', 'Voidfang lost its three-mark detonation'],
				['VOID_HUNGER_DETONATE_GAP', 'Voidfang lost the ceiling on its detonation - it is an infinite DPS machine again'],
				// The awakened tier has to actually be different, or the upgrade is a lore line.
				['VOID_HUNGER_DETONATE_GAP_AWAKENED', 'the awakened Voidfang no longer shortens the dead time between detonations'],
				['RIFT_SLASH_COOLDOWN_TICKS_AWAKENED', 'the awakened Voidfang no longer carves its rift sooner'],
				['ASTRAL_MARKS_AWAKENED', 'the awakened Starfall no longer bursts an arrow sooner'],
				['STARFALL_STARS_AWAKENED', 'the awakened Starfall no longer brings down more stars'],
				['IMPACT_RADIUS_AWAKENED', 'the awakened Enderheart no longer has a wider shockwave'],
				['private static void carve(', 'Voidfang lost Rift Slash - the right-click carves nothing'],
				['ASTRAL_MARKS', 'Starfall lost its stacking Astral Mark'],
				['class Volley', 'Starfall lost its charged shot - nothing comes down around the target'],
				['public static void onArrowHit(', 'Starfall arrows no longer mark - the passive has no delivery'],
				['gravityBreak(', 'Enderheart lost Gravity Break'],
				['enderfall(', 'Enderheart lost Enderfall'],
				['public static void onEnderheartHit(', 'Enderheart lost its impact shockwave'],
			])
		}

		// 28i) The player-facing sidebar. Four things have to line up or a player is left with a
		//      board that never appears: the manager, the server-wide gate it reads, the reload /
		//      save hooks, and the command that turns it on.
		def scoreboardManager = new File(srcRoot, 'economy/ScoreboardManager.java')
		if (!scoreboardManager.exists()) {
			problems << 'ScoreboardManager is gone - /stats scoreboard has nothing to draw a board with'
		} else {
			pinned(stripComments(scoreboardManager), [
				['FEATURE = "scoreboard"', 'the sidebar no longer names its own feature gate - ModConfig cannot switch it off'],
				['new ClientboundSetDisplayObjectivePacket(', 'the sidebar no longer sends a per-player display packet - every board is now the same shared one'],
				['player.connection.send(packet)', 'the sidebar no longer writes to one connection - there is no per-player sink left'],
				// The three packets a board is made of. Vanilla sends an objective to *nobody*: only an
				// objective sitting in a global display slot is ever sent to a client, and an objective
				// that is not sent is a board the client cannot draw - which is exactly the state this
				// sidebar was in, so the packets are pinned rather than trusted.
				['ClientboundSetObjectivePacket.METHOD_ADD', 'the board no longer sends its own objective to its owner - the client is told to display a board it has never heard of'],
				['ClientboundSetObjectivePacket.METHOD_REMOVE', 'the board has no way to take its objective off a client again - a board shown once stays in that client'],
				['new ClientboundSetScorePacket(', 'the board no longer pushes its rows at their owner - nothing on the sidebar is ever drawn'],
				['if (rows.equals(panel.order))', 'the board no longer checks whether a row moved before sending it - every refresh is back to re-sending the board'],
				['public static void hide(', 'the sidebar has no way to be taken down - a player who turns it off keeps seeing it'],
				['public static List<String> lines(', 'the sidebar has no line builder - the board cannot be described anywhere, including by its own edit screen'],
				['public static boolean moveLine(', 'the board can no longer be reordered - the line order is a fixed template again'],
				['public static void setBanner(', 'the banner can no longer be swapped between the title and the address'],
				['public static String banner(', 'the board no longer has a single banner builder - the promoted text has no source'],
				// The two halves of "only you can see it". The first is what keeps the objective out of a
				// *shared* slot, where vanilla broadcasts the display packet - and then every score on the
				// objective - to the whole server; without it, one call to setDisplayObjective anywhere
				// publishes somebody's sidebar, and nothing would ever notice. The second is the world's
				// refusal to spend a refresh per second on a sidebar in single player.
				['unshare(sb, panel)', 'nothing takes a board back out of a global display slot any more - any caller that puts one there shows it to every player'],
				['automaticDraw(server.isSingleplayer())', 'the timer draws in a single-player world again - one player, no address, and a refresh every second for decoration'],
				// The address line: off by default (it is the widest line a new board can carry, and a
				// sidebar is as wide as its widest line), refused entirely where there is no address to
				// print, and turned on by writing one.
				['bool(o, "ip", false)', 'the address line is on by default again - a fresh board leads with the widest thing it can carry'],
				// The address is read, not stored: it comes out of the handshake the player connected
				// through, so it is the address they are actually on rather than one the server was
				// told to print. Clamped to the width of the board's own lines, because a sidebar is
				// exactly as wide as its widest line and the address is the one line a player neither
				// wrote nor can shorten.
				['public static String serverAddress(', 'the address line no longer asks which address this player joined on'],
				['ServerAddress.of(p)', 'the board stopped reading the address a player joined through'],
				['fit(address, addressBudget(p, s))', 'the address is no longer clamped to the width of the lines around it - a long hostname sets how wide every sidebar is'],
				['fit(address, addressBudget(p, s)))', 'the promoted address is no longer clamped either - a board whose banner is the address is still as wide as the address'],
				['LEGACY_DEFAULT_IP.equals(s.serverIp)', 'a board saved before the address became live keeps the hardcoded one - the real address never reaches it'],
				['public static boolean addressDrawable(', 'the address no longer knows whether there is one to print - a single-player world grows an address line'],
				['if (!text.isEmpty() && addressDrawable(p))', 'writing an address no longer shows it - the line stays off and the command looks broken'],
				// Nothing about a board may be broadcast: the sink writes to one connection, and the only
				// way to reach every player from here is a player list, which this class may not have.
			])
		}
		if (menuHub.exists() && !(stripComments(menuHub) =~ /Commands\.literal\("stats"\)/)) {
