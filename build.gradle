			['duel/DuelManager.java', /LethalBlows\.wouldKill\(p, source, amount\)/, 'DuelManager: the totem gate no longer asks whether the blow would kill - every hit in a match spends a totem and leaves the fighter on one heart'],
			['duel/DuelManager.java', /aTotemWouldAnswer\(p, source, amount\)/, 'DuelManager: the totem decision is no longer the one the gate makes'],
