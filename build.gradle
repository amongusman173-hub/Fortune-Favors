plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'JetBrains Compose'
		url = 'https://maven.pkg.jetbrains.space/public/p/compose/dev'
	}
	maven {
		name = 'Google'
		url = 'https://maven.google.com/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		name = 'Sonatype Snapshots'
		url = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
	}
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("fortuneandfavors.accesswidener")

	mods {
		"fortuneandfavors" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Config screens
	implementation "me.shedaniel.cloth:cloth-config-fabric:26.2.155"
	implementation "com.terraformersmc:modmenu:20.0.1"
}

// ---------------------------------------------------------------------------
// iCloud Drive conflict-copy hygiene.
//
// This project lives inside iCloud Drive, which keeps resurrecting stale
// "<name> <n>.<ext>" conflict copies. Minecraft's Identifier rejects spaces, so
// every one that reaches a mod resource root floods the log with
// "Invalid path in mod resource-pack ... 2.json, ignoring" - and a conflict copy
// that shadows a live datapack entry (recipe/advancement/dimension/mixin config)
// silently changes what the game loads. Excluding them from the copy tasks is not
// enough on its own: iCloud writes new copies straight into build/resources after
// the copy has run, and those are then read by dev runs and by the jar task.
//
// So: (1) every resource-copying task excludes them, and (2) a single sccrub task
// runs before anything that reads the resource roots, deleting whatever iCloud
// dropped there since the last build. A clean jar can no longer depend on a clean
// build directory.
// Matches both "<name> <n>.<ext>" files AND "<name> <n>" directories - iCloud
// duplicates whole folders too, and a stray "assets/fortuneandfavors 2" makes the
// game log "ignored invalid namespace: fortuneandfavors 2" on every reload.
def ICLOUD_CONFLICT = { String name ->
	name != null && name.matches(".* \\d+(\\..+)?")
}

tasks.withType(ProcessResources).configureEach {
	exclude { details -> ICLOUD_CONFLICT(details.name) }
}

// ...and the Java source sets, which had no guard at all. A stale conflict copy of a
// *resource* is a file the game declines to read; a stale conflict copy of a *source
// file* is a file javac compiles, and a duplicate `public class Foo` is a hard failure -
// "class Foo is public, should be declared in a file named Foo.java" - naming a path
// nobody wrote and nobody edited. One `MiningZoneManager 2.java`, written by iCloud on
// its own schedule, left the whole build red that way. Excluding them here makes
// compilation immune to the copy whether or not the scrub below has reached it yet.
[sourceSets.main, sourceSets.client].each { ss ->
	ss.java.exclude { details -> ICLOUD_CONFLICT(details.name) }
}

// The scrub has to run before the *compiler*, not only before the game. It was wired to
// jar and the run tasks below; a plain `compileJava` asked for nothing, and that is the
// one build that reads the sources and nothing else.
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
	dependsOn 'scrubICloudConflicts'
}

tasks.register('scrubICloudConflicts') {
	group = 'build'
	description = 'Delete iCloud "<name> <n>.<ext>" conflict copies from the resource roots before anything reads them.'

	doLast {
		int removed = 0
		// `resourcepack` is in the list for the same reason `src` is, and it was the gap: it is
		// the art's source of truth - `processResources` reads it straight into the jar, and
		// `tools/build_resourcepack.py` zips it into the download - so a conflict copy landing on
		// top of an item definition or a texture is a file the game reads and nobody wrote. It is
		// also the tree iCloud is least kind to, because the art generators rewrite these files in
		// place on every run. A `bow 2.json` beside `bow.json` does not merely ship junk: the pack
		// builder reads the same custom item out of both and refuses to write a pack whose two
		// Bedrock identifiers collide, which arrives as "the textures are broken" and is really
		// "the texture pack could not be built".
		['build', 'src', 'resourcepack'].each { String root ->
			def dir = file(root)
			if (!dir.exists()) {
				return
			}
			def hits = []
			dir.eachFileRecurse { File f ->
				if (ICLOUD_CONFLICT(f.name)) {
					hits << f
				}
			}
			// Deepest first, so a duplicated directory tree is removed in one pass
			// instead of leaving half-deleted shells behind.
			hits.sort { File f -> -f.path.count(File.separator) }
			hits.each { File f ->
				if (!f.exists() || f == dir) {
					return
				}
				boolean gone = f.isDirectory() ? f.deleteDir() : f.delete()
				if (gone) {
					removed++
				}
			}
		}
		if (removed > 0) {
			logger.lifecycle("Scrubbed ${removed} iCloud conflict cop${removed == 1 ? 'y' : 'ies'} from the build output")
		}
	}
}

// ---------------------------------------------------------------------------
// Verification gates. Two layers, because they catch different things:
//
//   ffAuditSources (in `check`) - pure static audit of the sources and datapack:
//     every shipped JSON parses, every crafting recipe and its recipe-book
//     unlock ship together, every menu class is reachable from real code, and
//     every command the help text advertises is actually registered. Runs in a
//     second, needs no game, and is wired into `check` so it gates `build`.
//
//   ffSelfTest - boots a headless dev server that asserts the runtime surface
//     (item catalog + aliases, every claim/spawner/machine recovery path,
//     data-file integrity, the join-time registry fingerprint, the command
//     surface, and the recipe unlocks), writes build/ff-selftest.json, and then
//     FAILS the build if anything came back broken. Slow by nature (it runs a
//     server on purpose), so it is opt-in: ./gradlew ffSelfTest
//
def reportFile = layout.buildDirectory.file('ff-selftest.json')
def selftestRequested = gradle.startParameter.taskNames.any {
	it.equalsIgnoreCase('ffSelfTest') || it.toLowerCase().endsWith(':ffselftest')
}

// The wither smoke test is opt-in (see WitherTestDriver). Forward -Dff.wtest=true
// from the Gradle command line to the forked server JVM, so the documented
// invocation actually works. FF_WTEST=1 in the environment works too, since
// JavaExec inherits the environment by default.
tasks.matching { it.name == 'runServer' || it.name == 'runClient' }.configureEach {
	if (System.getProperty('ff.wtest') != null) {
		systemProperty 'ff.wtest', System.getProperty('ff.wtest')
	}

	// Only when ffSelfTest asked for it - a normal runServer stays interactive.
	if (selftestRequested || System.getProperty('ff.selftest') != null) {
		systemProperty 'ff.selftest', 'true'
		systemProperty 'ff.selftest.report', reportFile.get().asFile.absolutePath
	}
}

tasks.register('ffAuditSources') {
	group = 'verification'
	description = 'Static audit: datapack JSON validity, recipe/unlock pairing, reachable menus, advertised commands.'

	// iCloud resurrects "<name> <n>.json" conflict copies inside src/, and one of
	// those poisoning the datapack used to fail this audit for the wrong reason.
	// Scrub first so the gate always audits the real tree.
	dependsOn 'scrubICloudConflicts'

	doLast {
		def problems = []
		def srcRoot = file('src/main/java/com/fortuneandfavors')
		def resourceRoot = file('src/main/resources')
		def dataRoot = new File(resourceRoot, 'data/fortuneandfavors')

		// 1) Every shipped JSON must parse. A single malformed file silently
		//    drops its recipe/advancement/dimension from the datapack.
		def sourceFiles = []
		if (dataRoot.exists()) {
			dataRoot.eachFileRecurse { File f -> if (f.name.endsWith('.json')) sourceFiles << f }
		}
		def slurper = new groovy.json.JsonSlurper()
		def parsed = [:]
		sourceFiles.each { File f ->
			try {
				parsed[f] = slurper.parse(f)
			} catch (Exception e) {
				problems << "invalid JSON: ${f.absolutePath - (projectDir.absolutePath + File.separator)} (${e.message?.take(120)})"
			}
		}

		// 2) A crafting recipe and its recipe-book unlock ship together, or the
		//    recipe is invisible in the book (its recipe silently does not appear).
		def recipeIds = []
		def recipeDir = new File(dataRoot, 'recipe')
		if (recipeDir.exists()) {
			recipeDir.eachFile { File f -> if (f.name.endsWith('.json')) recipeIds << f.name.replace('.json', '') }
		}
		def unlockIds = []
		def unlockDir = new File(dataRoot, 'advancement/recipes')
		if (unlockDir.exists()) {
			unlockDir.eachFile { File f -> if (f.name.endsWith('.json')) unlockIds << f.name.replace('.json', '') }
		}
		(recipeIds - unlockIds).each { problems << "recipe '${it}' has no advancement/recipes/${it}.json unlock - it will not appear in the recipe book" }
		(unlockIds - recipeIds).each { problems << "advancement/recipes/${it}.json unlocks a recipe that does not exist" }

		// 3) Every menu must be reachable from real code. This is what caught the
		//    orphaned duplicate ForgeMenu that no longer had any caller.
		def menuDir = new File(srcRoot, 'menu')
		def allSources = []
		file('src').eachFileRecurse { File f -> if (f.name.endsWith('.java')) allSources << f }
		if (menuDir.exists()) {
			menuDir.eachFile { File f ->
				if (!f.name.endsWith('.java')) {
					return
				}
				def cls = f.name.replace('.java', '')
				def pattern = ~(/\b${java.util.regex.Pattern.quote(cls)}\b/) as java.util.regex.Pattern
				boolean referenced = allSources.any { File other ->
					other != f && pattern.matcher(other.getText('UTF-8')).find()
				}
				if (!referenced) {
					problems << "menu ${cls} is never opened from any code - an unreachable feature"
				}
			}
		}

		// 4) Every command the help text advertises must be registered. Catches a
		//    help page promising a command that was renamed or never added.
		def commandsText = new StringBuilder()
		allSources.each { File f -> commandsText.append(f.getText('UTF-8')) }
		def registered = []
		(commandsText.toString() =~ /Commands\.(?:literal|argument)\(\s*"([a-zA-Z_0-9]+)"\s*\)/).each { m -> registered << m[1] }
		def registeredLower = registered*.toLowerCase() as Set
		def menuHub = new File(srcRoot, 'ModCommands.java')
		if (menuHub.exists()) {
			def helpText = menuHub.getText('UTF-8')
			int idx = helpText.indexOf('private static int ffHelpTopic')
			if (idx > 0) {
				def page = helpText.substring(idx, Math.min(helpText.length(), idx + 40000))
				def advertised = (page =~ /&e\/([a-zA-Z_0-9]+)/).collect { it[1] } as Set
				advertised.each { name ->
					if (!registeredLower.contains(name.toLowerCase())) {
						problems << "/ff help advertises /${name} but no command with that name is registered"
					}
				}
			}
		}

		// 5) The right-click dispatch table in ModEvents must still mirror the
		//    dispatch chain. USE_PREDICATES is the declaration beside
		//    USE_HANDLERS / PASSIVE_TYPES, and SelfTest proves every catalog item
		//    type is in one of those two tables at runtime. Together: a new branch
		//    in onUseItem without a declared, classified type fails the build.
		def events = new File(srcRoot, 'ModEvents.java')
		if (events.exists()) {
			def eventsText = events.getText('UTF-8')
			def chainStart = eventsText.indexOf('private static InteractionResult onUseItem(')
			def declaredStart = eventsText.indexOf('private static final java.util.Set<String> USE_PREDICATES')
			def declaredEnd = eventsText.indexOf('public static java.util.Set<String> passiveTypes()')
			if (chainStart < 0 || declaredStart < 0 || declaredEnd < 0 || declaredEnd < declaredStart) {
				problems << 'ModEvents: could not locate onUseItem / USE_PREDICATES / passiveTypes() - the item use audit cannot run'
			} else {
				// onUseItem's body: from its opening brace to the matching close.
				int brace = eventsText.indexOf('{', chainStart)
				int depth = 0
				int end = brace
				for (int i = brace; i < eventsText.length(); i++) {
					char c = eventsText.charAt(i)
					if (c == '{') depth++
					else if (c == '}') {
						depth--
						if (depth == 0) { end = i; break }
					}
				}
				def chain = eventsText.substring(brace, end)
				def declared = eventsText.substring(declaredStart, declaredEnd)
				def used = (chain =~ /ModItems\.(is[A-Za-z0-9_]+)\(/).collect { it[1] } as Set
				def listed = (declared =~ /"(is[A-Za-z0-9_]+)"/).collect { it[1] } as Set
				(used - listed).each { problems << "ModEvents.onUseItem tests ModItems.${it}() but USE_PREDICATES does not declare it - add the predicate AND classify the item type in USE_HANDLERS or PASSIVE_TYPES" }
				(listed - used).each { problems << "USE_PREDICATES declares ${it} but onUseItem no longer tests it - remove the stale entry" }
				logger.lifecycle("ffAuditSources: item use dispatch covers ${used.size()} predicate(s), all declared.")
			}
		}

		// 6) A crafting recipe's result must describe an item the mod recognises.
		//    Every crafted custom item carries `custom_data.ff = <type>` and a
		//    custom_model_data number; if either drifts from ModItems.java the
		//    crafted stack is a *different* item that no code handles - which is
		//    exactly how a craftable token ends up "not working".
		def modItemsFile = new File(srcRoot, 'ModItems.java')
		if (modItemsFile.exists() && recipeDir.exists()) {
			def modItemsText = modItemsFile.getText('UTF-8')
			def declaredTypes = (modItemsText =~ /setType\(stack,\s*"([a-z_0-9]+)"\)/).collect { it[1] } as Set
			(declaredTypes = (declaredTypes + (modItemsText =~ /String TYPE_[A-Z_0-9]+ = "([a-z_0-9]+)"/).collect { it[1] })) as Set
			// Compare on the integer part only: the JSON may write 4550060 while
			// ModItems.java writes cmd(4550060.0F).
			//
			// Every id the file names, not only the ones written inline as cmd(...) - the
			// same authority the art check above uses, and for the same reason. A model id
			// handed out through a named constant (the Wooden Marionette's, the Puppeteer's
			// loot box) was invisible here, so a recipe minting that model was reported as
			// rendering as the plain vanilla item it is built on. Comments are stripped for
			// the reason they are stripped there: a code an item used to have must not count
			// as one it has.
			def recipeCodeText = modItemsText.replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			def modelNumbers = (recipeCodeText =~ /\b(4550[0-9]{3})\b/).collect { it[1] } as Set

			recipeDir.eachFile { File f ->
				if (!f.name.endsWith('.json')) {
					return
				}
				def doc = parsed[f]
				if (doc == null) {
					return
				}
				def result = doc['result']
				if (!(result instanceof Map)) {
					return
				}
				def components = result['components']
				if (!(components instanceof Map)) {
					return
				}
				def customData = components['minecraft:custom_data']
				if (!(customData instanceof Map)) {
					return
				}
				def type = customData['ff']
				if (type == null) {
					return
				}
				if (!declaredTypes.contains(type.toString())) {
					problems << "recipe/${f.name}: result declares custom_data.ff = '${type}' but ModItems.java never sets that type - the crafted item would drop straight out of every is*() check"
				}
				def modelData = components['minecraft:custom_model_data']
				def floats = modelData instanceof Map ? modelData['floats'] : null
				if (floats instanceof List && !floats.isEmpty()) {
					def number = floats[0].toString().tokenize('.')[0]
					if (!modelNumbers.contains(number)) {
						problems << "recipe/${f.name}: custom_model_data ${floats[0]} is not used by any ModItems.java cmd(...) - the item would render as the vanilla one"
					}
				}
			}
		}

		// 7) Shutdown teardown must actually be wired to something. Seven
		//    `onServerStopping` hooks had been written across the boss and gear
		//    systems and NOT ONE was registered with the server lifecycle, so every
		//    world stop left the fights' entities in the world while the in-memory
		//    state driving them vanished. A dead entry point compiles perfectly, so
		//    nothing caught it - this does.
		def teardownClasses = [] as Set
		allSources.each { File f ->
			if (f.getText('UTF-8') =~ /public static void onServerStopping\s*\(/) {
				teardownClasses << f.name.replace('.java', '')
			}
		}
		def corpus = new StringBuilder()
		allSources.each { File f -> corpus.append(f.getText('UTF-8')).append('\n') }
		def corpusText = corpus.toString()
		teardownClasses.each { cls ->
			def quoted = java.util.regex.Pattern.quote(cls)
			def callPattern = ~(/\b${quoted}\s*\.\s*onServerStopping\s*\(|\b${quoted}\s*::\s*onServerStopping\b/) as java.util.regex.Pattern
			if (!callPattern.matcher(corpusText).find()) {
				problems << "${cls}.onServerStopping() is never called from any code - its teardown never runs, so a server stop leaves that system's entities behind"
			}
		}
		// 8) Every custom_model_data the mod hands out must have art behind it, and that art
		//    must be the copy the pack ships. An item with a model number and no entry in
		//    `assets/minecraft/items/<base item>.json` renders as the plain vanilla item it is
		//    built on - the "my custom sword is a normal sword" report, invisible from the
		//    server and invisible in a dev client that has the standalone resource pack
		//    installed, which is exactly why it survived so long. This makes an item's art
		//    part of the build instead of something somebody remembers to draw.
		def packRoot = new File(projectDir, 'resourcepack/assets')
		def packItemDefs = new File(packRoot, 'minecraft/items')
		def packModels = new File(packRoot, 'fortuneandfavors/models/item')
		def packTextures = new File(packRoot, 'fortuneandfavors/textures/item')

		if (modItemsFile.exists()) {
			def modItemsText = modItemsFile.getText('UTF-8')
			// Every model id this file names, not only the ones written inline as cmd(...).
			//
			// The narrow version of this line read `cmd(N)` literals, and that is how five of
			// the Puppeteer's items shipped with no art for a whole release: they pointed at
			// ids that already belonged to Excalibur, the Mystery Box and the Mystery Keys,
			// and a code the file hands out through a named constant was invisible to the
			// check that exists to notice exactly that. Model ids are the only 45xxxxx numbers
			// in this file, so matching all of them cannot pick up anything else.
			// Comments are stripped before any of this is read. A comment that names an
			// old code - which is how the Death Compass's abandoned 4550040 is
			// documented at the line it left - would otherwise count as the item having
			// that code, and the file would pass on the strength of a sentence.
			def codeText = modItemsText.replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			def codes = (codeText =~ /\b(4550[0-9]{3})\b/).collect { it[1] } as Set
			def defined = ([] as Set)
			def referencedModels = ([] as Set)

			if (packItemDefs.exists()) {
				packItemDefs.eachFile { File f ->
					if (!f.name.endsWith('.json')) {
						return
					}
					def text = f.getText('UTF-8')
					(text =~ /"threshold"\s*:\s*([0-9]+)/).each { m -> defined << m[1] }
					(text =~ /"model"\s*:\s*"fortuneandfavors:item\/([a-z_0-9\/]+)"/).each { m -> referencedModels << m[1] }
				}
			}

			(codes - defined).each {
				problems << "ModItems.java hands out custom_model_data ${it} but no resourcepack/assets/minecraft/items/*.json uses it - that item renders as the vanilla item it is built on"
			}

			// Every code must be defined on the base item the method that hands it out
			// actually mints - not merely somewhere in the pack. The check above pools
			// every code and every definition into two global sets, which is how a code
			// that belongs to one item and is handed out by another counts as covered:
			// the Death Compass wore the Sculk Medallion's 4550040 (a code only has to be
			// unique per base item, so nothing objected) and rendered as a plain vanilla
			// compass, while this audit reported it as backed by art.
			def codeBases = [:]
			codeText.split(/(?=\n   public static )/).each { String block ->
				def baseMatcher = (block =~ /new ItemStack\(Items\.(\w+)\)/)
				if (!baseMatcher.find()) {
					return
				}
				def bases = (baseMatcher.collect { it[1].toLowerCase() } as Set)
				(block =~ /\b(4550[0-9]{3})\b/).each { m ->
					if (!codeBases.containsKey(m[1])) {
						codeBases[m[1]] = ([] as Set)
					}
					codeBases[m[1]].addAll(bases)
				}
			}
			codeBases.each { String code, Set bases ->
				bases.each { String base ->
					File baseDef = new File(packItemDefs, "${base}.json")
					if (!baseDef.exists()) {
						problems << "ModItems.java hands out custom_model_data ${code} on ${base}, but there is no resourcepack/assets/minecraft/items/${base}.json - that item renders as the vanilla item it is built on"
						return
					}
					if (!(baseDef.getText('UTF-8') =~ /"threshold"\s*:\s*${code}(?!\d)/)) {
						problems << "custom_model_data ${code} is handed out on ${base}, but ${base}.json has no entry for it - that item renders as the vanilla item it is built on"
					}
				}
			}

			referencedModels.each { String name ->
				File modelFile = new File(packModels, "${name}.json")
				if (!modelFile.exists()) {
					problems << "an item definition points at fortuneandfavors:item/${name}, but resourcepack/assets/fortuneandfavors/models/item/${name}.json does not exist"
					return
				}
				def model = slurper.parse(modelFile)
				def textures = model['textures']
				if (!(textures instanceof Map)) {
					return
				}
				textures.each { key, value ->
					if (value instanceof String && value.startsWith('fortuneandfavors:item/')) {
						String tex = value.substring('fortuneandfavors:item/'.length())
						if (!new File(packTextures, "${tex}.png").exists()) {
							problems << "model ${name} draws fortuneandfavors:item/${tex}, but that texture is not in resourcepack/assets/fortuneandfavors/textures/item - the item renders as the missing-texture checkerboard"
						}
					}
				}
			}

			// Art that lives only under the client source set is dead weight that shadows
			// nothing (the pack is synced over it) and quietly lies about what ships.
			File clientArt = new File(projectDir, 'src/client/resources/assets/fortuneandfavors')
			if (clientArt.exists()) {
				clientArt.eachFileRecurse { File f ->
					if (!f.isFile()) {
						return
					}
					String rel = f.path.substring(clientArt.path.length() + 1)
					if (rel.startsWith('models/item/') || rel.startsWith('textures/item/')) {
						if (!new File(packRoot, 'fortuneandfavors/' + rel).exists()) {
							problems << "src/client/resources/.../fortuneandfavors/${rel} is not in resourcepack/assets - the pack is the source of truth for item art, so this file ships nothing and misleads the next person to edit it"
						}
					}
				}
			}

			if (problems.isEmpty()) {
				logger.lifecycle("ffAuditSources: ${codeBases.size()} custom model code(s), every one defined on the base item it is minted on, backed by pack art in ${referencedModels.size()} model(s).")
			}
		}

		// 8b) And the rest of the pack's art: every model's parent has to resolve and every
		//     texture it draws has to be on disk. The item definitions above only cover the
		//     items; a block or entity model with a typo in a texture path renders as the
		//     missing-texture checkerboard, in game, on a server, with nothing in the log.
		int packModelsChecked = 0
		File packModelRoot = new File(packRoot, 'fortuneandfavors/models')
		if (packModelRoot.exists()) {
			packModelRoot.eachFileRecurse { File f ->
				if (!f.isFile() || !f.name.endsWith('.json')) {
					return
				}
				String rel = f.path.substring(packModelRoot.path.length() + 1).replace('\\', '/')
				String here = 'fortuneandfavors/models/' + rel
				def model = null
				try {
					model = slurper.parse(f)
				} catch (Exception e) {
					problems << "${here} does not parse: ${e.message?.take(120)}"
					return
				}
				if (!(model instanceof Map)) {
					return
				}
				packModelsChecked++
				def parent = model['parent']
				if (parent instanceof String && parent.startsWith('fortuneandfavors:')) {
					if (!new File(packRoot, 'fortuneandfavors/models/' + parent.substring('fortuneandfavors:'.length()) + '.json').exists()) {
						problems << "${here} inherits from ${parent}, which is not in the pack - the model falls back to a missing one"
					}
				}
				def textures = model['textures']
				if (textures instanceof Map) {
					textures.each { key, value ->
						if (value instanceof String && value.startsWith('fortuneandfavors:')) {
							String tex = value.substring('fortuneandfavors:'.length())
							if (!new File(packRoot, 'fortuneandfavors/textures/' + tex + '.png').exists()) {
								problems << "${here} draws ${value}, but resourcepack/assets/fortuneandfavors/textures/${tex}.png does not exist - that face renders as the missing-texture checkerboard"
							}
						}
					}
				}
			}
			logger.lifecycle("ffAuditSources: ${packModelsChecked} pack model(s) resolve their parents and textures.")
		}

		// 8c) ...and the half of every definition that belongs to *vanilla*. The checks above only ever
		//     resolved `fortuneandfavors:` references, which is how a whole class of bug shipped: an
		//     item definition here *replaces* vanilla's own (same path, same name), so it has to repeat
		//     vanilla's fallback - and the first machine-icon generator guessed `minecraft:item/<base>`
		//     for every one of them. Block items are mostly `minecraft:block/<base>`, so eleven
		//     fallbacks pointed at models that do not exist: every ordinary furnace, iron block, gold
		//     block, crafting table, smithing table, lodestone, grindstone, blast furnace, smoker,
		//     composter and observer drew as the missing-texture checkerboard, and so did every GUI
		//     that used one as an icon - starting with the Super Smelter's tier window, whose header is
		//     a furnace. "My icons are corrupted" was that, and nothing here could see it.
		//
		//     The client jar is a resource pack and it is already on disk for the compile, so every
		//     `minecraft:` model or parent named by the pack is checked against its own model list.
		int vanillaModelsChecked = 0
		def packItemDefFiles = (packItemDefs.exists() ? packItemDefs.listFiles() : new File[0]).toList()
		def packModelFiles = (packModelRoot.exists() ? packModelRoot.listFiles() : new File[0]).toList()
		if (!packItemDefFiles.isEmpty() || !packModelFiles.isEmpty()) {
			def mcVersion = (project.findProperty('minecraft_version') ?: '').toString()
			def loomCache = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${mcVersion}")
			def clientJar = ['minecraft-client.jar', 'minecraft-client-only.jar', 'minecraft-merged.jar']
				.collect { new File(loomCache, it) }.find { it.exists() }
			if (clientJar == null) {
				problems << "could not find the vanilla client jar under ${loomCache} - every minecraft: model the pack names is unchecked, and a fallback pointing at a model that does not exist renders as the missing-texture checkerboard"
			} else {
				def vanillaModelNames = ([] as Set)
				new java.util.zip.ZipFile(clientJar).withCloseable { zip ->
					zip.entries().each { entry ->
						def n = entry.name
						if (n.startsWith('assets/minecraft/models/') && n.endsWith('.json')) {
							vanillaModelNames << n.substring('assets/minecraft/models/'.length(), n.length() - '.json'.length())
						}
					}
				}
				if (vanillaModelNames.isEmpty()) {
					problems << "${clientJar} carries no assets/minecraft/models - the vanilla model check would pass on an empty list, which is worse than no check"
				}
				def vanillaRefs = { File f, String here ->
					def node = null
					try { node = slurper.parse(f) } catch (Exception ignored) { return }
					def walk
					walk = { Object n ->
						if (n instanceof Map) {
							n.each { k, v ->
								if ((k == 'model' || k == 'parent') && v instanceof String && v.startsWith('minecraft:')) {
									String ref = v.substring('minecraft:'.length())
									if (!vanillaModelNames.contains(ref)) {
										problems << "${here} points at ${v}, which is not a model in ${clientJar.name} - it renders as the missing-texture checkerboard"
									}
									vanillaModelsChecked++
								} else {
									walk(v)
								}
							}
						} else if (n instanceof List) {
							n.each { walk(it) }
						}
					}
					walk(node)
				}
				packItemDefFiles.each { File f ->
					if (f.name.endsWith('.json') && !(f.name =~ / \d+(\..+)?$/)) {
						vanillaRefs(f, "resourcepack/assets/minecraft/items/${f.name}")
					}
				}
				packModelFiles.each { File f ->
					if (f.name.endsWith('.json')) {
						vanillaRefs(f, "fortuneandfavors/models/${f.name}")
					}
				}
				logger.lifecycle("ffAuditSources: ${vanillaModelsChecked} minecraft: model reference(s) in the pack exist in the vanilla client jar.")
			}
		}

		// 9) A claim rule that nothing calls is not a claim rule. The fluid border hook is a
		//    mixin, and deleting the class, dropping it from the mixin config, or dropping the
		//    call inside it all compile perfectly while silently reopening bucket griefing.
		def mixinConfig = new File(resourceRoot, 'fortuneandfavors.mixins.json')
		def mixinText = mixinConfig.exists() ? mixinConfig.getText('UTF-8') : ''
		[
			['mixin/FlowingFluidMixin.java', 'FlowingFluidMixin', 'ClaimManager\\.fluidMaySpreadInto\\(', 'fluid flows into claims again'],
			['mixin/DispenserBlockMixin.java', 'DispenserBlockMixin', 'ClaimManager\\.dispenserMayAct\\(', 'a dispenser can fire fire, water and bone meal into a claim again'],
			['mixin/LevelDestroyBlockMixin.java', 'LevelDestroyBlockMixin', 'ClaimManager\\.mobMayDestroy\\(', 'mobs can take a claim apart again'],
			// Fire is the one claim rule that has to be asked at BOTH ends: the flame already
			// burning inside a claim, and the flame arriving from outside it. Reading only the
			// first is what made "Fire spread" read in game as "my fire is frozen and their
			// fire walks in", and dropping the ignition half would quietly restore it.
			['mixin/FireBlockMixin.java', 'FireBlockMixin', 'ClaimManager\\.fireMayIgniteAt\\(', 'fire spreads into protected claims again'],
			['mixin/FireBlockMixin.java', 'FireBlockMixin', 'getStateWithAge', 'fire is refused at the source again, so a neighbour flame can walk into a claim'],
			// The address on a sidebar. The host a player dialled exists exactly once, in the
			// handshake, and vanilla keeps none of it - so the two pieces of plumbing that carry it
			// inward are pinned as hooks like any other: the handler that records it (and the fact
			// that it records it), and the accessor that ties a connection to the player who used
			// it. Unregistered, either one loads as nothing at all and the board goes back to
			// printing whatever hardcoded address it was given, with every test still green.
			['mixin/HandshakeAddressMixin.java', 'HandshakeAddressMixin', 'ServerAddress\\.remember\\(', 'the board can no longer learn which address a player joined through'],
			['mixin/ConnectionAccessor.java', 'ConnectionAccessor', '@Accessor\\(.connection.\\)', 'an address can no longer be tied back to the player who used it']
		].each { entry ->
			File mixinFile = new File(srcRoot, entry[0])
			if (!mixinFile.exists()) {
				problems << "${entry[0]} is gone - ${entry[3]}"
				return
			}
			if (!(mixinText =~ /"${entry[1]}"/)) {
				problems << "${entry[1]} exists but is not listed in fortuneandfavors.mixins.json - it never loads, so ${entry[3]}"
			}
			if (!(mixinFile.getText('UTF-8') =~ /${entry[2]}/)) {
				problems << "${entry[1]} never asks its ClaimManager rule - the hook loads and does nothing"
			}
		}

		// 10) An event may take a sky back, never apply one. A level's rain level is not a
		//     private render value: ServerLevel.advanceWeatherCycle reads it every weather tick
		//     and sends it to every client as a RAIN_LEVEL_CHANGE, which is how the snowstorm
		//     spent ten minutes raining - "it makes it rain and will never stop". The event draws
		//     its own snow instead, and this line is what keeps a later "make the storm feel
		//     darker" from putting the rain back. Only a clear (0.0) is allowed in this file.
		def disasterFile = new File(srcRoot, 'economy/ServerDisasterManager.java')
		if (disasterFile.exists()) {
			def disasterText = disasterFile.getText('UTF-8')
			(disasterText =~ /setRainLevel\(\s*([0-9.]+)F\s*\)/).each { m ->
				if (m[1] != '0.0' && m[1] != '0') {
					problems << "ServerDisasterManager.java sets a rain level of ${m[1]} - that is rain on every client, and the snowstorm has to draw its own snow instead"
				}
			}
			if (disasterText =~ /setWeatherParameters\(/) {
				problems << "ServerDisasterManager.java drives the weather cycle directly - an event sets a sky it then has to take back"
			}
		}

		// 10b) The sea and the sky are two full fights and six legendaries, and almost none of that
		//      work is visible from outside the mod: a boss whose tick is not registered still spawns
		//      and still dies (it simply never moves), a lethal-blow rule that is not registered
		//      still lets the body fall over (with no ceremony and no loot), a loot box missing from
		//      the box gate still opens the menu for every other box (and does nothing for that one),
		//      and a chestplate whose tick is not registered is four dead abilities that read as four
		//      unreleased ones. Every one of these compiles, and every one of these is one missing
		//      line. So each is pinned at the call site rather than described in a comment.
		def seaSkyEvents = new File(srcRoot, 'ModEvents.java')
		def seaSkyText = seaSkyEvents.exists()
			? seaSkyEvents.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			: ''
		[
			[/com\.fortuneandfavors\.economy\.DrownedSovereignManager\.tick\(/, 'the Drowned Sovereign never ticks - he spawns, stands still and dies'],
			[/com\.fortuneandfavors\.economy\.GaleWardenManager\.tick\(/, 'the Gale Warden never ticks - he spawns, stands still and dies'],
			[/com\.fortuneandfavors\.economy\.SeaAndSkyGear\.tick\(/, 'the Warden\'s Mantle never ticks - its four abilities are all in that loop, so the chestplate does nothing'],
			[/com\.fortuneandfavors\.economy\.DrownedSovereignManager\.onLethalDamage\(/, 'the sea boss\'s death is no longer caught, so the killing blow lands on a body with a dozen hazards still in the air'],
			[/com\.fortuneandfavors\.economy\.GaleWardenManager\.onLethalDamage\(/, 'the sky boss\'s death is no longer caught, so he falls out of the air mid-move with the loot ledger unopened'],
			[/com\.fortuneandfavors\.economy\.GaleWardenManager\.onBossDamaged\(/, 'nothing answers a blow on the Gale Warden - Gale Counter and Absolute Momentum are both read there, so both are dead'],
			[/com\.fortuneandfavors\.economy\.DrownedSovereignManager\.onBossDeath\(/, 'the sea boss pays no loot on a death that did not go through his ceremony (an admin /kill drops nothing)'],
			[/com\.fortuneandfavors\.economy\.GaleWardenManager\.onBossDeath\(/, 'the sky boss pays no loot on a death that did not go through his ceremony'],
			[/com\.fortuneandfavors\.economy\.SeaAndSkyGear\.onLethalFallDamage\(/, 'the Mantle\'s Second Wind is never asked, so the one save it promises never happens'],
			[/com\.fortuneandfavors\.economy\.SeaAndSkyGear\.onPlayerDisconnect\(/, 'nothing forgets a leaving player\'s marks and thrown rings - a mark would outlive the arm that placed it'],
			[/ModItems\.isDrownedLootBox\(held\)/, 'the Drowned Loot Box is missing from the right-click gate, so it silently does nothing when opened'],
			[/ModItems\.isGaleLootBox\(held\)/, 'the Gale Loot Box is missing from the right-click gate, so it silently does nothing when opened']
		].each { entry ->
			if (!(seaSkyText =~ entry[0])) {
				problems << "ModEvents.java: ${entry[1]}"
			}
		}
		// The Mantle's own two halves live outside ModEvents: the fall it softens is scaled in the
		// damage pipeline (there is no allow/blame step that can scale rather than cancel), and the
		// in-flight effects and cooldowns are torn down by the server lifecycle.
		def enchantText = new File(srcRoot, 'economy/CCEnchantments.java').exists()
			? new File(srcRoot, 'economy/CCEnchantments.java').getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			: ''
		if (!(enchantText =~ /SeaAndSkyGear\.scaleFallDamage\(/)) {
			problems << "CCEnchantments.java: the Warden's Mantle no longer softens a fall - Light as Air is now a line in a tooltip"
		}
		def modText = new File(srcRoot, 'FortuneFavorsMod.java').exists()
			? new File(srcRoot, 'FortuneFavorsMod.java').getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			: ''
		if (!(modText =~ /SeaAndSkyGear::clear/)) {
			problems << "FortuneFavorsMod.java: the sea and sky gear state is never reset, so the next world in the same process inherits waves, whirlpools and cooldowns"
		}

		// 10c) The sky boss is the one fight in the mod that says nothing, and that is a decision
		//      rather than an omission: he used to carry a summon banner, a line on nearly every
		//      move and four taunts on a timer, so the fight read as a page of text with a boss
		//      behind it. The action bar still names each move as it starts (that is the fight
		//      saying what is about to happen, not the boss talking), but no chat sender may come
		//      back into this file. Gravity is pinned for the neighbouring reason: he is a breeze,
		//      and a breeze that stops obeying gravity hovers - which reads as a hologram rather
		//      than a boss, and was the exact bug the summon's own comment is about.
		def galeFile = new File(srcRoot, 'economy/GaleWardenManager.java')
		if (!galeFile.exists()) {
			problems << "economy/GaleWardenManager.java is gone - the sky boss is no longer audited at all"
		} else {
			def galeText = galeFile.getText('UTF-8')
				.replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			[
				[/Chat\.raw\(/, 'a chat line'],
				[/\bannounce\(/, 'a chat broadcast'],
				[/\bannounceNear\(/, 'a chat broadcast'],
				[/\bspeak\(/, 'a spoken line'],
				[/\btaunt\(/, 'a taunt']
			].each { entry ->
				if (galeText =~ entry[0]) {
					problems << "GaleWardenManager.java sends ${entry[1]} again - the sky boss is a silent fight, and a line of talk is dialogue however it is dressed up"
				}
			}
			if (!(galeText =~ /setNoGravity\(false\)/)) {
				problems << "GaleWardenManager.java no longer tells the Gale Warden to obey gravity - a breeze that ignores it hovers, and a hovering boss reads as a bug"
			}
		}

		// 10d) The sea boss may never raise a guardian again, and the ones an older build raised
		//      have to be reachable. A guardian's attack is a beam it keeps firing for as long as it
		//      can see anybody, so a persistent guardian is a guardian-attack sound with no end -
		//      and the bodies a previous version left standing are not something an upgrade can
		//      remove by itself. So two rules: nothing in this file spawns a guardian, and the sweep
		//      that clears the old ones is actually scheduled rather than merely written.
		def seaFile = new File(srcRoot, 'economy/DrownedSovereignManager.java')
		if (!seaFile.exists()) {
			problems << "economy/DrownedSovereignManager.java is gone - the sea boss is no longer audited at all"
		} else {
			def seaText = seaFile.getText('UTF-8')
				.replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (seaText.contains('EntityTypes.GUARDIAN')) {
				problems << "DrownedSovereignManager.java spawns guardians again - a guardian never stops firing its beam, which is the looping attack sound players reported"
			}
			if (!seaText.contains('sweepLegacyGuardians(')) {
				problems << "DrownedSovereignManager.java has no legacy-guardian sweep - guardians an older build left persistent in a world are a sound with no end"
			}
			// The sea boss talks less than nobody. His summon banner, his taunt, his per-phase lines
			// and the action-bar line on every move were all text over a fight that is read off the
			// water, so the announcement funnels in the file are deliberately closed. A closed
			// funnel is one line away from being reopened, so the funnels stay and the *real*
			// senders are pinned: as long as no line here reaches chat, the fight stays silent.
			[
				[/Chat\.raw\(/, 'a chat line'],
				[/Chat\.msg\(/, 'a chat message'],
				[/broadcastSystemMessage\(/, 'a server broadcast'],
				[/\bspeak\(/, 'a spoken line'],
				[/\btaunt\(/, 'a taunt']
			].each { entry ->
				if (seaText =~ entry[0]) {
					problems << "DrownedSovereignManager.java sends ${entry[1]} again - the sea boss is a silent fight, and every line of talk is text instead of a shape on the water"
				}
			}
			if (!seaText.contains('MINION_TAG')) {
				problems << "DrownedSovereignManager.java no longer tags its raised bodies, so the sweep cannot tell our leftovers from a monument's own guardians"
			}
			def sweepsText = new File(srcRoot, 'FortuneFavorsMod.java').getText('UTF-8')
			if (!sweepsText.contains('DrownedSovereignManager.sweepLegacyGuardians(')) {
				problems << "the legacy-guardian sweep is written and never called - players in older worlds keep hearing a guardian attack forever"
			}
			if (!sweepsText.contains('DrownedSovereignManager.sweepStrays(')) {
				problems << "the sea boss own stray sweep is written and never called - a crashed fight leaves an immortal body in the world"
			}
		}

		// 10e) The expedition maze is a place to walk through, and it has been wrong in both of the
		//      ways that no screenshot of one room shows. It has been a cage: every mouth of an
		//      uncleared chamber barred behind the player, and since a barred archway barred its
		//      neighbour too, the doorway you walked in through became a wall and the room you were
		//      standing in became the only way out of it. And it has been a void: thirty wide and
		//      twelve tall, lit by nothing but a two-by-two lantern cluster over the middle - which
		//      lights the middle.
		//
		//      The chamber now closes on purpose, and a lock is only a lock if it is the one the
		//      player chose. So the rule is no longer "no bars anywhere" - that was the way to stop
		//      the cage, not the thing the maze needs. It is that the bars are raised behind an
		//      explorer who has COMMITTED to the chamber (past the threshold, never in a doorway),
		//      that they are recorded on the chamber so the chamber can take them down itself, that
		//      taking them down is what clearing it does, and that a pickaxe cannot open one. Plus
		//      the old ground rules: the cut that opens an archway still sweeps the walk lane behind
		//      it, the ceiling wears a grid of lamps rather than a cluster, and the footprint stays a
		//      room rather than a warehouse.
		def mazeFile = new File(srcRoot, 'economy/ExpeditionManager.java')
		if (!mazeFile.exists()) {
			problems << "economy/ExpeditionManager.java is gone - the dungeon crawler is no longer audited at all"
		} else {
			def mazeText = mazeFile.getText('UTF-8')
				.replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			[
				[/paintDoor\(/, 'the archway painter that barred mouths as the maze was built is back'],
				[/doorSealed\(/, 'the build-time door-seal test is back - an archway that bars when either side is uncleared locks the player in the room they walked into'],
				[/repaintDoors\(/, 'the seal repaint is back - the maze paints bars into its doors as it carves them again']
			].each { entry ->
				if (mazeText =~ entry[0]) {
					problems << "ExpeditionManager.java: ${entry[1]}"
				}
			}
			[
				[/room\.sealed/, 'ExpeditionManager.java keeps no room seal state - a chamber cannot take down a lock it never recorded'],
				[/sealRoom\(/, 'ExpeditionManager.java has no chamber seal - a room full of monsters is a room the player can sprint through'],
				[/deepInside\(/, 'ExpeditionManager.java has no committed-or-in-the-doorway test - without it the bars can close on an explorer standing in the threshold'],
				[/unsealRoom\(s, room\)/, 'clearing a chamber no longer takes its bars down - the lock would outlive the fight it was for'],
				[/isSealedDoorBar\(/, 'the sealed bars are not enforced - a lock a pickaxe opens is not a lock'],
				[/room\.visited && deepInside\(/, 'the seal is no longer gated on the chamber having woken and the explorer having committed']
			].each { entry ->
				if (!(mazeText =~ entry[0])) {
					problems << "ExpeditionManager.java: ${entry[1]}"
				}
			}
			if (!(mazeText =~ /carveArchway\(/)) {
				problems << "ExpeditionManager.java has no archway cut - the maze's doors are painted by something that does not know where the wall band is"
			}
			if (mazeText.findAll(/inDoorLane\(/).size() < 3) {
				problems << "ExpeditionManager.java no longer asks whether a block stands in a doorway - a baseboard or a crate left in a mouth is a doorway furnished shut"
			}
			if (!(mazeText =~ (/COFFER\s*=\s*\d+/))) {
				problems << "ExpeditionManager.java has no coffer spacing - the ceiling beams, the wall pilasters and the lantern grid have stopped sharing one grid"
			}
			if ((mazeText =~ /REDSTONE_LAMP/) && !(mazeText =~ /RedstoneLampBlock\.LIT/)) {
				problems << "ExpeditionManager.java places redstone lamps without lighting them - an unlit redstone lamp emits nothing, and every lamp in a boss lair is a dark block"
			}
			def pitchM = mazeText =~ /int ROOM_PITCH\s*=\s*(\d+)/
			def heightM = mazeText =~ /int ROOM_HEIGHT\s*=\s*(\d+)/
			if (!pitchM.find()) {
				problems << "ExpeditionManager.java has no chamber footprint left to check"
			} else {
				int pitch = pitchM.group(1) as int
				if (pitch < 24 || pitch > 32) {
					problems << "ExpeditionManager.java builds chambers ${pitch} blocks across - that much floor is floor no light reaches the far side of"
				}
			}
			if (!heightM.find()) {
				problems << "ExpeditionManager.java has no chamber height left to check"
			} else {
				int hallHeight = heightM.group(1) as int
				if (hallHeight < 8 || hallHeight > 11) {
					problems << "ExpeditionManager.java builds chambers ${hallHeight} blocks tall - a hall this wide needs a roof its lanterns can still reach the floor from"
				}
			}
		}

		// 11) The gem shop must not sell the game's answer to a map. The list of things it may
		//     never stock is checked for its contents by the self-test; what this pins is that
		//     the rule is still there to be asked, at the shelf and at the purchase, because a
		//     never-sold list that nothing reads is the same shop with a comment in it.
		def shopFile = new File(srcRoot, 'menu/GemShopMenu.java')
		if (!shopFile.exists()) {
			problems << "menu/GemShopMenu.java is gone - the gem shop is no longer audited at all"
		} else {
			def shopText = shopFile.getText('UTF-8')
			if (!(shopText =~ /NEVER_STOCKED/)) {
				problems << "GemShopMenu.java has no never-sold list - anything can be stocked again"
			}
			if (!(shopText =~ /shopMayStock\(/)) {
				problems << "GemShopMenu.java never asks shopMayStock - the rule is written down and never applied"
			}
			if (!(shopText =~ /neverStockedForTest\(/)) {
				problems << "GemShopMenu.java has no test seam for its shelf rule - the self-test cannot see it"
			}
		}		// 12) Every screen this mod opens has to be one the Bedrock translator knows. The report
		//     was a Bedrock client that could not open ANY gui after a loot box. A custom menu
		//     type is the one way a Java mod can do that to a Bedrock client: Geyser translates
		//     the vanilla screen types and nothing else, and a player the server thinks is inside
		//     a menu they never received cannot open the next one either. Every menu here is a
		//     vanilla chest grid today; this is what keeps it that way.
		def vanillaMenuTypes = [
			'GENERIC_9x1', 'GENERIC_9x2', 'GENERIC_9x3', 'GENERIC_9x4', 'GENERIC_9x5', 'GENERIC_9x6',
			'HOPPER', 'ANVIL', 'SHULKER_BOX', 'MERCHANT', 'CRAFTER_3x3', 'SMITHING', 'GRINDSTONE', 'LOOM'
		]
		def menusChecked = 0
		new File(srcRoot, 'menu').listFiles()?.each { menuFile ->
			if (!menuFile.name.endsWith('.java')) {
				return
			}
			menusChecked++
			def menuText = menuFile.getText('UTF-8')
			if (menuText =~ /MenuType\.register\(/) {
				problems << "menu/${menuFile.name} registers a menu type of its own - Geyser cannot translate a custom menu, and a Bedrock client stuck in one cannot open any other screen"
			}
			(menuText =~ /super\(MenuType\.([A-Za-z0-9_]+)/).each { hit ->
				if (!vanillaMenuTypes.contains(hit[1])) {
					problems << "menu/${menuFile.name} opens a ${hit[1]} screen - Geyser translates only the vanilla menu types, so a Bedrock client may never receive it"
				}
			}
		}
		logger.lifecycle("ffAuditSources: ${menusChecked} menu(s) open on vanilla screen types, so a Bedrock client can be served all of them.")

		// 13) An exemption stands down ONE measurement, and a blanket one may not touch a fight.
		//     The store used to treat a `*` exemption as covering every check in the file, which
		//     is how "antifall is on so nothing in a fight is detected" happened: the movement
		//     exemption also silenced the kill aura, aim, reach, hitbox and criticals checks.
		//     The rule lives in AntiCheatStore.covers now; this is what keeps anybody from
		//     expanding it back to a blanket by hand.
		File storeFile = new File(srcRoot, 'anticheat/AntiCheatStore.java')
		if (!storeFile.exists()) {
			problems << "anticheat/AntiCheatStore.java is gone - the exemption rule is unaudited"
		} else {
			String storeText = storeFile.getText('UTF-8')
			if (!(storeText =~ /covers\(exemption\.check\(\), check, isCombatCheck\(check\)\)/)) {
				problems << "AntiCheatStore.exempt no longer asks covers() - an exemption can cover any check again, including the ones that judge a fight"
			}
			if (!(storeText =~ /COMBAT_CHECKS/)) {
				problems << "AntiCheatStore has no combat check family - a blanket `*` exemption blinds the kill aura, aim, reach and criticals checks"
			}
			if (!(storeText =~ /hasAnyExemption\(/)) {
				problems << "AntiCheatStore lost hasAnyExemption - the readouts would ask whether a `*` covers the literal check \"*\" and always say no"
			}
		}

		// 14) A kick has to do something. A rung on the automatic ladder is a warning and is never
		//     listed as a ban; a moderator's kick carries a re-entry window and the join path
		//     enforces it, or it is a disconnect the player can undo by reconnecting.
		File acFile = new File(srcRoot, 'anticheat/AntiCheat.java')
		if (acFile.exists()) {
			String acText = acFile.getText('UTF-8')
			if (!(acText =~ /AntiCheatStore\.kickHoldsFor\(record,/)) {
				problems << "anticheat/AntiCheat.java no longer enforces a moderator's kick on join - the kick is a disconnect the player can undo by reconnecting"
			}
			if (!(acText =~ /AntiCheatStore\.WARN_KICK/)) {
				problems << "the automatic ladder files its warning kick as an ordinary kick again, so every warning shows up as a ban"
			}

			// 14b) ...and a kick has to be *reachable*. The automatic half used to be entered only
			//      from inside the alert branch of flag(), which made `alert-vl` a second,
			//      undocumented switch for the failsafe: set above `enforce-vl` - a legal pair of
			//      values, and the pair an owner reaches for when the alerts are noisy - a finding
			//      could be over the enforcement bar and never be acted on, with nothing in any log
			//      saying why. That is what "the anticheat kick does not work" looks like from the
			//      outside, so the property is pinned positionally: the call is not inside the
			//      `if (!announce)` branch, and nothing returns out of the method ahead of it.
			def acNoComments = acText.replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			def flagSource = acNoComments =~ /(?s)private static void flag\(ServerPlayer player, String check, String detail, double weight\) \{(.*?)\n   \}/
			if (!flagSource.find()) {
				problems << 'anticheat/AntiCheat.java no longer has a flag(...) method the audit can read, so nothing keeps the automatic half reachable from a finding'
			} else {
				def flagBody = flagSource.group(1)
				int announceAt = flagBody.indexOf('if (!announce)')
				int enforceAt = flagBody.indexOf('enforce(player, check, violation, now);')
				if (announceAt < 0 || enforceAt < 0) {
					problems << 'anticheat/AntiCheat.java: flag() no longer offers the finding to enforce(...) - the alert path is the only way to the automatic half again, so a finding over the enforcement bar can be silently never acted on'
				} else if (enforceAt < announceAt || flagBody.substring(announceAt, enforceAt).contains('return;')) {
					problems << 'anticheat/AntiCheat.java: enforce(...) is inside the alert branch again - raising the alert bar above the enforcement bar switches the kick off without saying so'
				}
			}
			// ...and the evidence has to be allowed to be the agreement. A client that keeps every
			// single check under its own bar is invisible to a module that reads one check at a
			// time, which is the shape of every hacked client that knows how an anticheat reads.
			if (!(acNoComments =~ /int agreeing = agreeingChecks\(player\);/)) {
				problems << 'anticheat/AntiCheat.java: the automatic half no longer counts agreeing checks, so a body tripping several physical models at once is never acted on'
			}
			// ...and the line between what may be acted on and what may only be alerted has to stay
			// drawn where the code says it is. Ore vision is a set of mining statistics - a yield
			// percentage, a run of finds with no stone between them - and an honest player who digs
			// a straight line toward a seam produces every one of them.
			def autoEnforceList = acNoComments =~ /(?s)AUTO_ENFORCE = List\.of\((.*?)\);/
			if (!autoEnforceList.find()) {
				problems << 'anticheat/AntiCheat.java no longer declares AUTO_ENFORCE in a form the audit can read, so the line between what may be acted on and what may only be alerted is unaudited'
			} else if (autoEnforceList.group(1) =~ /\bORE_VISION\b/) {
				problems << 'anticheat/AntiCheat.java: ore-vision is auto-enforceable again - it is a set of mining statistics rather than a physical model, and a disconnect is not how a habit should be answered'
			}
		}

		// 15) A payload's type must be registered before anything registers a receiver for it, and in
		//     the direction that receiver lives on. This is the one wiring mistake the self-test cannot
		//     see: ffSelfTest boots a *server*, and the End's credits receiver is client-only, so the
		//     missing registration line crashed the game inside the client entrypoint - "Cannot register
		//     handler as no payload type has been registered with name 'fortuneandfavors:credits_music'"
		//     - with every one of the 248 checks still green. The rule reads the payload classes out of
		//     net/ and matches them against both halves of that wiring, so the build says it first.
		def payloadDir = new File(srcRoot, 'net')
		if (payloadDir.exists()) {
			def declaredPayloads = [] as Set
			payloadDir.eachFile { File f ->
				if (f.name ==~ /\w+Payload\.java/) {
					declaredPayloads << f.name.replace('.java', '')
				}
			}
			def registeredPayloads = [] as List
			def requiredPayloads = [] as List
			allSources.each { File f ->
				String text = f.getText('UTF-8')
				// `\s*` in both: the receiver in client/CreditsMusic and the registration on a long
				// line are both wrapped, so a rule that demanded the payload on the same line as the
				// call matched neither and passed vacuously.
				def regMatcher = text =~ /PayloadTypeRegistry\.(\w+)\(\)\.register\(\s*(\w+Payload)\.TYPE/
				while (regMatcher.find()) {
					registeredPayloads << (regMatcher.group(2) + '|' + regMatcher.group(1))
				}
				def recvMatcher = text =~ /(Client|Server)PlayNetworking\.registerGlobalReceiver\(\s*(\w+Payload)\.TYPE/
				while (recvMatcher.find()) {
					String direction = (recvMatcher.group(1) == 'Client') ? 'clientboundPlay' : 'serverboundPlay'
					requiredPayloads << (recvMatcher.group(2) + '|' + direction)
				}
			}
			declaredPayloads.each { String p ->
				if (!registeredPayloads.any { String r -> r.startsWith(p + '|') }) {
					problems << "net/${p}.java declares a payload type that nothing registers with PayloadTypeRegistry - a receiver of it, or a send, throws on startup"
				}
			}
			requiredPayloads.each { String key ->
				if (!registeredPayloads.contains(key)) {
					def parts = key.split('\\|')
					problems << "${parts[0]} has a global receiver, but no PayloadTypeRegistry.${parts[1]}().register(${parts[0]}.TYPE, ...) - the side that receives it crashes with 'no payload type has been registered'"
				}
			}
			logger.lifecycle("ffAuditSources: ${declaredPayloads.size()} payload type(s), every receiver's type registered in its own direction.")
		}

		// 16) The stand-in a Bedrock client is handed has to be a sound the pack redefines. Two halves
		//     hold that up and neither can see the other: BedrockMusic.java names the music disc a cut
		//     is played as, and tools/build_resourcepack.py redefines the Bedrock name it arrives under.
		//     Renaming one without the other is silent music on every Bedrock client with no error
		//     anywhere, so the two tables are compared here.
		File bedrockMusicFile = new File(srcRoot, 'economy/BedrockMusic.java')
		File packBuilderFile = new File(projectDir, 'tools/build_resourcepack.py')
		if (!bedrockMusicFile.exists() || !packBuilderFile.exists()) {
			problems << "economy/BedrockMusic.java or tools/build_resourcepack.py is gone - the Bedrock music stand-in table is unaudited"
		} else {
			def javaStandIns = [] as List
			def javaMatcher = bedrockMusicFile.getText('UTF-8') =~ /"(record\.\w+)"/
			while (javaMatcher.find()) {
				javaStandIns << javaMatcher.group(1)
			}
			def packAliases = [] as List
			def packMatcher = packBuilderFile.getText('UTF-8') =~ /"(record\.\w+)"\s*:\s*"\w+"/
			while (packMatcher.find()) {
				packAliases << packMatcher.group(1)
			}
			if (javaStandIns.isEmpty()) {
				problems << "BedrockMusic.java names no Bedrock stand-in - a Bedrock client's soundtrack is silence"
			}
			((javaStandIns as Set) - (packAliases as Set)).each { problems << "BedrockMusic hands a client '${it}', but the pack does not redefine it - the sound arrives as nothing" }
			((packAliases as Set) - (javaStandIns as Set)).each { problems << "the pack redefines '${it}', but nothing ever hands a client that name - a disc is replaced for nothing" }
			logger.lifecycle("ffAuditSources: ${javaStandIns.size()} Bedrock music stand-in(s), each one redefined by the pack.")
		}

		// A Geyser custom-item mapping has to hand Geyser a whole number. Its own example writes
		// `42`, and while the docs call the value a float, a JSON `42` parses into an int or a float
		// reader alike whereas `42.0` is refused by every int reader - and a mappings file Geyser
		// cannot parse is loaded as nothing at all: every custom item silently rendering as the
		// vanilla item it is built on, on a server that did everything else right.
		if (packBuilderFile.exists() && !(packBuilderFile.getText('UTF-8') =~ /"custom_model_data":\s*int\(/)) {
			problems << "tools/build_resourcepack.py writes a non-integer custom_model_data - Geyser can refuse the whole mappings file and every custom item stays vanilla"
		}

		// ...and the Bedrock half has to be shippable on its own. A Bedrock client imports a pack, and
		// Geyser's `packs/` folder is given a pack - not a pack with a Java `assets/` half and a
		// `pack.mcmeta` beside it. That combined archive is the Java client's download; the Bedrock
		// one is the `.mcpack`, and with nothing writing it there is nothing to hand either of them.
		if (packBuilderFile.exists() && !(packBuilderFile.getText('UTF-8') =~ /\.mcpack/)) {
			problems << "tools/build_resourcepack.py no longer writes a Bedrock-only .mcpack - there is nothing to import on a Bedrock client or to drop in Geyser's packs/ folder"
		}

		// 11) A refused break has to put the block back on the client. The client predicts the
		//     break when it swings, so its copy is gone before the server has an opinion, and
		//     vanilla is what corrects it - from inside destroyBlock, which both of this mod's
		//     refusal layers run in front of. Without the resync the miner watches a block vanish
		//     that the server still holds: a ghost block, until a relog. Both layers are checked
		//     here because they are independent (the mixin is the fail-closed backstop for the
		//     event layer) and either one alone leaves half the refusals silent.
		[
			['mixin/ServerPlayerGameModeMixin.java', 'the claim backstop refuses breaks without telling the client'],
			['ModEvents.java', 'the block-break event refuses breaks without telling the client']
		].each { entry ->
			File refuser = new File(srcRoot, entry[0])
			if (refuser.exists() && !(refuser.getText('UTF-8') =~ /ClientResync\.block\(/)) {
				problems << "${entry[0]}: ${entry[1]} - the predicted break stays gone and the block comes back on a relog"
			}
		}

		// Every other refusal door, and the truth each one owes the client. The check is that
		// the file mentions the resync at all rather than a particular call: the door decides
		// which correction is honest (a block for a placement, a hand for an item use, a hand
		// for a swing), and what must not happen is a refusal layer that owes the client an
		// answer and never sends one. A door added later goes in this list, or it ships as a
		// desync nobody can reproduce from a log.
		[
			['mixin/ServerPlayerGameModeMixin.java', 'the fail-closed backstop refuses a right-click the client already drew'],
			['mixin/LevelDestroyBlockMixin.java', 'the mirage and mob rule refuses a break inside the call that answers the client'],
			['mixin/PlayerAttackMixin.java', 'the claim backstop refuses a swing the client already ran on its own hand'],
			['ModEvents.java', 'the event layer refuses uses, attacks and entity interactions on the client\'s behalf']
		].each { entry ->
			File refuser = new File(srcRoot, entry[0])
			if (refuser.exists() && !(refuser.getText('UTF-8') =~ /ClientResync\./)) {
				problems << "${entry[0]}: ${entry[1]} without telling the client - a client/server desync until a relog"
			}
		}

		// 12) The wiring of the two systems that report nothing when they break.
		//
		//     Guild score was only ever paid to the attacker a blow named - and every raid
		//     boss ends its own fight with the mod's own damage, so a boss death arrived with
		//     no attacker at all and paid nothing. The fix reads the killer off the body's last
		//     hitter, and both score routes now live in their own listener, because the score
		//     used to sit inside the giant entity-death handler where any boss system above it
		//     could starve it. The other half of this build is the forgotten King of the
		//     expedition throne halls: a boss who cannot be woken by damage, who arrives one
		//     beat at a time, and who is a full fight or nothing at all.
		//
		//     None of this is visible from a menu and none of it throws - a score that never
		//     moves, a King nobody can wake, a hall that leaves one more King behind every run.
		//     Each line here is one of those, anchored to the code that prevents it. Comments
		//     are stripped first, so a comment that promises the wiring is worth nothing.
		[
			['ModEvents.java', /AFTER_DEATH\.register\([^\n]*guild score/, 'ModEvents: guild score has no listener of its own - it is inside the giant death handler again, where any boss system above it can starve it'],
			['ModEvents.java', /lastPlayerHitter\(/, 'ModEvents: the score listener no longer asks the body who hit it last - a boss ended by its own ceremony reports no attacker and pays nothing'],
			['ModEvents.java', /GuildManager\.creditBossKill\(/, 'ModEvents: a boss kill bypasses the once-only ledger, so a boss reported by its ceremony and again by its death pays twice'],
			['ModEvents.java', /MirageCastleManager\.wakeKing\(/, 'ModEvents: nothing wakes a throne King - he cannot be damaged and cannot be dragged into a fight'],
			['ModEvents.java', /grantRespawningCorruptionPack\(newPlayer\)/, 'ModEvents: the pack a held death parked is never handed to the body that respawns - a respawn is a new player, so the pack stays in the corpse'],
			['ModEvents.java', /AFTER_DEATH\.register\([^\n]*onDeath\(/, 'ModEvents: the giant entity-death handler (onDeath) is registered nowhere - it compiles and the server boots, and every death in the mod goes unhandled: boss loot ledgers, the Mindbinder pack restore, player feats, duels, streak, prison and expedition credit'],
			['duel/DuelManager.java', /GuildManager\.creditDuelWin\(/, 'DuelManager: a duel win pays no guild score, and a duel refuses the blow that would report one - so duelling earns nothing'],
			['economy/MirageCastleManager.java', /throneHall\(level, o\)/, 'MirageCastleManager: the castle no longer builds a throne hall, so the King has no address again'],
			['economy/MirageCastleManager.java', /seatTheKing\(server\)/, 'MirageCastleManager: the hall is built and nobody is seated in it'],
			['economy/MirageCastleManager.java', /BossManager\.THRONE_KING_TAG/, 'MirageCastleManager: the seated King is not tagged, so nothing can recognise him'],
			['economy/MirageCastleManager.java', /retireThroneHall\(\)/, 'MirageCastleManager: the court is never retired, so every castle leaves one more King sitting in the world'],
			['economy/MirageCastleManager.java', /tickKing\(server\)/, 'MirageCastleManager: the hall has no clock - the seated King never speaks and his fall is never paid'],
			['economy/BossManager.java', /THRONE_KING_NAME/, 'BossManager: the forgotten King has no name to announce'],
			['economy/BossManager.java', /title @a\[distance=\.\./, 'BossManager: the King\'s name is no longer announced through the game\'s own title command']
		].each { entry ->
			File wired = new File(srcRoot, entry[0])
			if (!wired.exists()) {
				problems << "${entry[0]} is gone - ${entry[2]}"
				return
			}
			def wiredText = wired.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(wiredText =~ entry[1])) {
				problems << entry[2]
			}
		}
		// And the raw grant is gone: a score added outside the ledger is a score that can
		// double-pay, which is the one thing the ledger exists to make impossible.
		def eventSource = new File(srcRoot, 'ModEvents.java')
		if (eventSource.exists() && (eventSource.getText('UTF-8') =~ /GuildManager\.addPve\(/)) {
			problems << 'ModEvents: a PvE score is granted outside GuildManager.creditBossKill - the same boss can pay twice, and the ledger stops meaning anything'
		}

		// 13) One decision for a fatal player blow, and one published order for it.
		//
		//     Three files each answered "this blow kills you, what happens instead?" with their
		//     own copy of the same arithmetic, a fourth copy in the duelling gate was quietly
		//     better than all of them, and a fifth hand-rolled vanilla's own totem ritual - which
		//     is exactly how "totems do nothing in the Gladiator" happened, because a gate that
		//     absorbs a blow by cancelling it is a gate vanilla's own totem check never runs
		//     behind. The arithmetic, the totem and the order live in LethalBlows now. A later
		//     "make the castle a bit kinder" that starts doing the sum again in place is the bug
		//     this line refuses, because two answers to "would this kill" is one more than there
		//     should be.
		[
			['economy/ExpeditionManager.java', 'the expedition fatal-blow rule re-implements the arithmetic instead of asking LethalBlows'],
			['economy/MirageCastleManager.java', 'the mirage fatal-blow rule re-implements the arithmetic instead of asking LethalBlows'],
			['economy/PrisonCellblock.java', 'the prison fatal-blow rule re-implements the arithmetic instead of asking LethalBlows']
		].each { entry ->
			File gate = new File(srcRoot, entry[0])
			if (!gate.exists()) {
				problems << "${entry[0]} is gone - ${entry[1]}"
				return
			}
			def gateText = gate.getText('UTF-8')
			if ((gateText =~ /getAbsorptionAmount\(\)\s*-\s*amount/) || (gateText =~ /getMainHandItem\(\)\.is\(Items\.TOTEM_OF_UNDYING\)/)) {
				problems << "${entry[0]}: ${entry[1]}"
			}
			if (!(gateText =~ /LethalBlows\.(verdict\(|Answer|Blow)/)) {
				problems << "${entry[0]}: the fatal-blow rule is no longer wired to LethalBlows at all - the walk cannot reach it"
			}
		}
		def lethalFile = new File(srcRoot, 'economy/LethalBlows.java')
		if (!lethalFile.exists()) {
			problems << 'economy/LethalBlows.java is gone - every rule is back to deciding on its own, in its own order'
		} else {
			def lethalText = lethalFile.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			// The walk has to be a fixed, published list: a rule that registers itself at runtime is
			// a rule nobody can read the order of, which is the property this file is for.
			if (!(lethalText =~ /RULES\s*=\s*new ArrayList<>/)) {
				problems << 'LethalBlows: the ordered rule list is no longer a fixed list - the decision order is now unreadable'
			}
		}
		def lethalCaller = new File(srcRoot, 'ModEvents.java')
		if (lethalCaller.exists() && !(lethalCaller.getText('UTF-8') =~ /LethalBlows\.resolve\(/)) {
			problems << 'ModEvents: the damage layer no longer asks the one ordered walk about a fatal player blow'
		}

		// And the hall is the castle's alone. It used to be generated by an expedition, in a chunk
		// of a maze nobody had walked - so the one boss in the mod who has to be found by speaking
		// to him was in the one place nobody could find. A castle is a single place that announces
		// itself when it rises, which is what makes a seated King findable at all.
		def expeditionFile = new File(srcRoot, 'economy/ExpeditionManager.java')
		if (expeditionFile.exists() && (expeditionFile.getText('UTF-8') =~ /Throne/)) {
			problems << 'ExpeditionManager: a throne hall is being generated outside the castle again - the King has exactly one address'
		}

		// 14) The same class of bug as the orphaned death handler, twice more, and the fight the
		//     last batch left half-built.
		//
		//     (a) The excavator paid double drops on a block a player had placed, and the ledger
		//     that was supposed to stop it lived in memory with a thirty-minute expiry: place a
		//     block, wait, break it, and the perk paid as if the world had grown it - or place a
		//     pile, restart the server, and break them all. It is on disk now, and its own record
		//     is checked against the block actually being broken.
		//
		//     (b) The snowstorm's cover was restored for the chunks that happened to be loaded
		//     and then the whole record was thrown away, file and all - so the snow it laid in a
		//     chunk nobody had open stayed on the ground forever, which is the one thing an event
		//     is not allowed to do to a world.
		//
		//     (c) The Distant Memory Of A Forgotten Monarch was a summoned King with a different
		//     name: same clocks, same fireballs, same devouring hold. His own rotation has to be
		//     ticked, its moves have to have something behind them, and his phase borders have to
		//     change the rotation rather than only the bar.
		[
			['economy/NaturalBlocks.java', /JsonUtil\.write\(dataFile, root\)/, 'NaturalBlocks: the placement ledger is never written to disk, so a restart turns every block a player placed back into world generation and the excavator pays for it'],
			['economy/NaturalBlocks.java', /PLACED\.get\(key\(level, pos\)\)/, 'NaturalBlocks: the answer is no longer checked against the block being broken, so an expired or mismatched record silently pays the perk'],
			['FortuneFavorsMod.java', /NaturalBlocks\.load\(server\)/, 'FortuneFavorsMod: the placement ledger is never loaded, so every placed block in the world reads as natural on boot'],
			['FortuneFavorsMod.java', /NaturalBlocks\.saveIfDirty\(server\)/, 'FortuneFavorsMod: the placement ledger is never saved - stopping the server launders every placed block into a natural one'],
			['economy/SkillManager.java', /NaturalBlocks\.isNatural\(level, brokenPos, state\)/, 'SkillManager: the excavator no longer asks who placed the block it is paying for'],
			['economy/MiningPity.java', /NaturalBlocks\.isNatural\(level, pos, state\)/, 'MiningPity: pity drops no longer ask who placed the block - the second copy of the same ledger is back'],
			['economy/MiningZoneManager.java', /NaturalBlocks\.isNatural\(level, pos, state\)/, 'MiningZoneManager: the zone bonus no longer asks who placed the block - a placed ore pays the dangerous-zone bonus again'],
			['economy/ServerDisasterManager.java', /restoreCover\(server, STORM_SNOW, false\)/, 'ServerDisasterManager: the storm no longer takes its cover back through restoreCover'],
			['economy/ServerDisasterManager.java', /finishStormCover\(server, now\)/, 'ServerDisasterManager: nothing finishes the cover the storm could not reach, so snow in a chunk that was not loaded when the event ended stands there for good'],
			['economy/ServerDisasterManager.java', /ResourceKey\.create\(Registries\.DIMENSION/, 'ServerDisasterManager: the storm cover record has lost its dimension, so a clear puts the blocks back into whichever level the loop reached first'],
			['economy/BossManager.java', /tickThroneKing\(level, king, b\)/, 'BossManager: the Distant Memory is ticked by something other than his own fight'],
			['economy/BossManager.java', /if \(b\.throne\) \{/, 'BossManager: the seated monarch is no longer distinguished from a summoned King, so the forgotten King fights a warlord\'s pile of clocks again'],
