			['economy/MirageCastleManager.java', /BossManager\.dismissBoss\(/, 'MirageCastleManager: the castle no longer takes its King\'s fight down with it - a castle that ends mid-fight leaves the monarch\'s bar hanging over the field'],
			['economy/BossManager.java', /ModItems\.lastRemembrance\(king\.level\(\)\.registryAccess\(\)\)/, 'BossManager: the King is armed with a hand-built sword again, so the blade he swings and the blade he drops can drift apart'],
