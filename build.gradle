			if (!owner.exists()) {
				return
			}
			def ownerText = owner.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			int uses = (ownerText =~ /ModItems\.lastRemembrance\(/).count
			if (uses != (pair[1] as int)) {
				problems << "${pair[0]} mints the monarch's blade ${uses} time(s) rather than ${pair[1]} - the castle's unique drop has more than one faucet"
			}
		}

		// 21) A boss can leave the world without dying, and the exits are not all ours: an operator's
		//     /kill, a plugin, the void, another event's teardown taking the body with it (the Mirage
		//     Castle taking its King out with the castle is the version that shipped visibly). Nothing
		//     calls the killed-handler for a body that is not there, so the loop that drives those
		//     fights has to notice, and every other exit has to go through one teardown rather than a
		//     per-boss hand-written list - which is the drift this whole audit is about (the Slime
		//     King's despawn forgot his soul fires, the Elder Warden's forgot the shared six).
		//
		//     (a) The reconciliation exists in the boss loop, and it asks the discriminator.
