			['economy/ServerDisasterManager.java', /METEOR_FALL_TICKS = 140/, 'ServerDisasterManager: the meteor fall time no longer matches the height it is dropped from - higher with the old fall is a faster, not a longer, streak'],
			['economy/ScarletGear.java', /pulseTicks\(ritual\.tier\)/, 'ScarletGear: the prism drains on a fixed rhythm again, so its forge tier buys nothing'],
			['economy/ScarletGear.java', /drainShare\(ritual\.tier\)/, 'ScarletGear: the prism drains the same at every tier'],
			['economy/BlockValues.java', /migrateStaleDefaults\(server, file, root\)/, 'BlockValues: a raised default never reaches a world that already exists - the loader only fills in missing keys'],
			['economy/BlockValues.java', /SUGAR_CANE_VALUE = 25L/, 'BlockValues: sugar cane is back to paying nothing for a whole field']
		].each { entry ->
			File tuned = new File(srcRoot, entry[0])
			if (!tuned.exists()) {
				problems << "${entry[0]} is gone - ${entry[2]}"
				return
			}
			def tunedText = tuned.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(tunedText =~ entry[1])) {
