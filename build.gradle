		//     a chest is part of the save, so a stack that got into one under an older rule sits
		//     there forever - which is exactly "the elytra is still in the throne room". Three
		//     lines now, and each one is load-bearing: what the castle withholds, the single call
		//     that builds its loot refusing it, and the sweep that re-asks its standing chests.
		[
