			if (stormText =~ /STORM_(SNOW|ICE)\.clear\(\)/) {
				problems << 'ServerDisasterManager: the storm cover record is cleared wholesale again - anything it could not reach this pass is forgotten, and the snow stays'
			}
		}

		// 16) The window that drew buttons nobody could click, and the King who was placed into his
		//     own furniture.
