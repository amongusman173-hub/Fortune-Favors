			['economy/BossManager.java', /configureThroneKing\(king\)/, 'BossManager: the Distant Memory shares the summoned King\'s stat block again, so the fight of a sealed castle swings like a warlord'],
			['economy/BossManager.java', /armThroneKing\(king\)/, 'BossManager: the last beat of the announcement no longer arms him, so he stands up holding the ceremonial prop'],
			['economy/BossManager.java', /kingSkyfall\(level, mark\[0\], mark\[1\], mark\[2\], true\)/, 'BossManager: A THOUSAND YEARS no longer lands on the ground it telegraphed'],
			['economy/MirageCastleManager.java', /insideBuilding\(dx, dz\)/, 'MirageCastleManager: the courtyard is paved across the whole footprint again - it repaves the ground floor of the keep and both wings a moment after their rooms laid their own floors'],
			['economy/MirageCastleManager.java', /RoomPlan plan = planFor\(storey, i, j\)/, 'MirageCastleManager: the keep rooms are furnished by hand again rather than from the room table'],
			['economy/MirageCastleManager.java', /ROOM_PLANS\.get\(Math\.floorMod\(storey \* 4/, 'MirageCastleManager: the wing is back to one bare room repeated, ignoring the room table the keep uses'],
			['economy/MirageCastleManager.java', /DESIGN_ROOMS\.add\(/, 'MirageCastleManager: the design no longer writes down the rooms it built, so nothing can check the world it produced against the plan']
		].each { entry ->
			File placed = new File(srcRoot, entry[0])
			if (!placed.exists()) {
				problems << "${entry[0]} is gone - ${entry[2]}"
				return
			}
