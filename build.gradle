		}

		// 32) The exchange, and the interest that outlives the server. Both are systems whose whole
		//     point is that they keep moving while nobody is watching, which means every way they can
		//     break is a way that looks fine to whoever is online:
		//       - a price must be the five-minute grid and nothing else (tickAt), so the market cannot
		//         stop advancing when the server does. A price that depends on a running total is a
		//         market that is frozen for the week the world was off, and no chart can show it.
		//       - the salt must be read from market.json. Hard-coded, the entire future of every
		//         listing is computable from the source, and a guaranteed strategy is not a market.
		//       - MarketManager must not broadcast. "No alerts every five minutes - you check on your
		//         own" was the ask, and one broadcastSystemMessage in that file is the whole of it.
		//       - interest must go through catchUp(...). The single-day test it replaced paid one day
		//         for a week away, silently, on an account nobody could audit.
		def exchangeFile = new File(srcRoot, 'economy/MarketManager.java')
		if (!exchangeFile.exists()) {
			problems << 'economy/MarketManager.java is gone - the exchange is unaudited'
		} else {
			def exchangeText = stripComments(exchangeFile)
			if (!(exchangeText =~ /tickAt\(long epochSeconds\)\s*\{\s*return Math\.floorDiv\(epochSeconds, PERIOD_SECONDS\)/)) {
				problems << 'MarketManager.tickAt is no longer the epoch divided into PERIOD_SECONDS cells - a price that depends on anything else stops advancing while nobody is logged in, which is the one thing the exchange was built to do'
			}
			if (!(exchangeText =~ /priceOf\(Stock s, long tick\)/)) {
				problems << 'MarketManager.priceOf no longer takes the tick it is priced at - a price read from mutable state is a price that cannot be charted'
			}
			if (!exchangeText.contains('JsonUtil.jsonLong(root, "salt"')) {
				problems << 'the world salt is no longer read from market.json - the whole series becomes a constant every player can compute from this file'
			}
			if (exchangeText.contains('broadcast')) {
				problems << 'MarketManager broadcasts - a share price is something a player goes and looks at, and alerts every five minutes were explicitly not wanted'
			}
		}
		def vaultFile = new File(srcRoot, 'economy/BankManager.java')
		if (!vaultFile.exists()) {
			problems << 'economy/BankManager.java is gone - the vault is unaudited'
		} else {
			def vaultText = stripComments(vaultFile)
			if (!(vaultText =~ /catchUp\(long lastInterest, long now\)/)) {
				problems << 'BankManager.catchUp is gone - interest is back to one payout per overdue account, so a week of downtime pays a single day'
			}
			if (!(vaultText =~ /= catchUp\(a\.lastInterest\(\), now\)/)) {
				problems << 'BankManager.tick no longer settles through catchUp - however long a vault waited, it is paid for one day'
			}
			if (!(vaultText =~ /MAX_CATCHUP_DAYS = \d+/)) {
				problems << 'the catch-up cap is gone from BankManager - a vault left for a year is paid for a year'
			}
		}
		def stockWindowsFile = new File(srcRoot, 'menu/StockMenus.java')
		if (!stockWindowsFile.exists()) {
			problems << 'menu/StockMenus.java is gone - the shared stock windows are unaudited'
		} else if (!(stripComments(stockWindowsFile) =~ /public static void tick\(MinecraftServer server\)/)) {
			problems << 'StockMenus.tick is gone - an open chart never redraws itself and the five-minute update is invisible'
		}
		if (eventsFile.exists() && !(stripComments(eventsFile) =~ /StockMenus\.tick\(server\)/)) {
			problems << 'nothing calls StockMenus.tick() - a chart somebody has open keeps its last column until they happen to click something'
		}
		def modSourceFile = new File(srcRoot, 'FortuneFavorsMod.java')
		if (!modSourceFile.exists()) {
			problems << 'FortuneFavorsMod.java is gone - the market is never loaded or saved'
		} else {
			def modSourceText = stripComments(modSourceFile)
			if (!(modSourceText =~ /MarketManager\.load\(server\)/)) {
				problems << 'nothing calls MarketManager.load - every holding is forgotten on restart'
			}
