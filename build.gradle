				['extends AnvilPromptMenu', 'the scoreboard rename prompt is not the anvil prompt every other typed value in this mod uses'],
				['ScoreboardManager.setText(', 'the prompt no longer writes the board - it reads as if it saved and does not'],
				['returnInputOnCancel = false', 'the prompt hands its fake input item back to the player'],
