			['economy/MirageCastleManager.java', /!withheldFromTheCastle\(stack\)/, 'MirageCastleManager: the loot the castle builds is no longer filtered through what it withholds'],
			['economy/MirageCastleManager.java', /sweepWithheldLoot\(\)/, 'MirageCastleManager: the castle no longer re-asks the chests that are already standing in it, so one stocked by an older rule keeps its elytra forever']
