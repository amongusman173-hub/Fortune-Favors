			['economy/BossManager.java', /private static boolean bodyLeftTheWorld\(/, 'BossManager: there is no longer a way to tell a body that was removed from one in an unloaded chunk, so either a boss kept his bar over nothing or a walk away ends his fight'],
			['economy/BossManager.java', /private static boolean leavePolitely\(/, 'BossManager: the server-stop teardown no longer lets each fight out by its own door, so the Snow Queen\'s realm would trap its players and the Elder Warden\'s stolen loot would be lost'],
			['FortuneFavorsMod.java', /WitherReworkManager\.clearAll\(server\)/, 'FortuneFavorsMod: the reworked wither has no teardown wired, so a stop saves an invulnerable body with its vanilla bar still up'],
			['economy/WitherReworkManager.java', /hideBar\(f\)/, 'WitherReworkManager: the body-gone branch stopped taking the vanilla health bar down, which is the one thing it used to forget']
		].each { entry ->
			File owner = new File(srcRoot, entry[0])
			if (!owner.exists()) {
				problems << "${entry[0]} is gone - ${entry[2]}"
				return
			}
			def ownerText = owner.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(ownerText =~ entry[1])) {
				problems << entry[2]
			}
		}
		File bossSource = new File(srcRoot, 'economy/BossManager.java')
		if (bossSource.exists()) {
			def bossText = bossSource.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			def doorMatch = bossText =~ /(?s)private static boolean dismissBossCore\(.*?\n   \}/
			def probeMatch = bossText =~ /(?s)public static boolean leftoversForTest\(.*?\n   \}/
			if (!doorMatch.find()) {
				problems << 'BossManager: there is no one teardown for a fight any more, so every exit is a list somebody has to remember to update'
			} else if (!probeMatch.find()) {
				problems << 'BossManager: the leftovers probe is gone, so nothing asks whether an exit left rigging behind'
			} else {
				def doorBody = doorMatch.group()
				List<String> probed = []
				(probeMatch.group() =~ /(\w+)\.(?:containsKey|contains)\(id\)/).each { probed << it[1] }
				(probeMatch.group() =~ /(\w+)\.(?:values\(\)\.)?stream\(\)\.anyMatch/).each { probed << it[1] }
				probed = probed.unique()
				if (probed.size() < 8) {
					problems << "BossManager: the leftovers probe only asks about ${probed.size()} kind(s) of rigging - the fight has more than that, so an exit can leave one behind and still pass"
				}
				probed.each { name ->
					if (!(doorBody =~ /\b${name}\.(?:entrySet\(\)\.)?(?:remove|removeIf|add)\b/)) {
						problems << "BossManager: ${name} is part of a fight's rigging and the probe asks about it, but the one teardown no longer clears it - an exit will leave it in the world"
					}
				}
			}
		}

		// 22) The monarch's own two rare keepings - an Efficiency VII book and an Astral tome. Three
		//     ways this feature ships broken and not one of them throws. The book can be minted in a
		//     second place, so the roll a player sees and the item they get stop being the same
		//     thing; the stacks can go unmarked, so the castle's teardown sweeps a rare drop off the
		//     floor it fell on together with its own walls; and - the quiet one - the anvil can clamp
		//     the level, which turns "Efficiency VII" into a book that reads VII and does V.
		[
			['ModItems.java', /public static ItemStack monarchsEfficiencyBook\(HolderLookup\.Provider access\)/, 'ModItems: the Efficiency VII book the monarch drops has no definition, so the rare drop does not exist'],
