			['economy/PrisonCellblock.java', /spawnWarden\(p\)/, 'PrisonCellblock: full Heat no longer sends the Warden, so the manhunt is four ordinary guards again'],
			['economy/PrisonCellblock.java', /wardenReward\(rank\)/, 'PrisonCellblock: the Warden pays a fixed bounty instead of the one his fight is priced at'],
			//     (d) Mining paid one thing - the ore in the hand, sold later - on a slab that refills
			//     in front of a prisoner who never has to move. Momentum is the chain that gives
