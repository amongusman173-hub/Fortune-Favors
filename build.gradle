		// 20) The monarch's bar, and the one thing in the castle he really owned.
		//
		//     (a) Every ordinary boss ending goes through the killed-handler, which takes the fight's
		//     health bar off every screen. That handler walks bodies still in the world, and the
		//     castle takes its King out of the world by discarding him - so there has to be a way to
		//     put a fight down without a kill, and the teardown has to use it. Without both, a castle
		//     that ended mid-fight leaves its monarch's bar up over an empty field for the session.
		//
		//     (b) The blade is the exception the castle's whole fiction rests on: everything else in
		//     there is a mirage and leaves with the walls, so it has to be paid by the King's fall,
