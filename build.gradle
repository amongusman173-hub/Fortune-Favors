			//     Both live in one hook, and losing the call is how the loop goes flat again.
			['economy/PrisonCellblock.java', /PrisonManager\.onOreMined\(player, pos, state, price\)/, 'PrisonCellblock: the mine no longer calls the ore hook, so Momentum and the rich seams are dead and the loop is flat again'],
			['economy/PrisonManager.java', /plantSeam\(level, tier, owner\)/, 'PrisonManager: a floor refill no longer plants a rich seam, so the mine is the same ore everywhere again'],
