		// 15) Four balance and damage fixes whose failure mode is a player, not a crash.
		//
		//     (a) The Gladiator's totem gate asked whether a fighter *had* a totem and never whether
		//     the blow would kill them - so every punch in a match burned one, and the ritual drops
		//     the body to one heart, which is exactly "hit at max hp, instantly die and pop totem".
