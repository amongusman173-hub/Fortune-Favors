		// Every texture in the pack has to be an image, not merely a file called `.png`.
		//
		// This is the other half of "the textures are broken", and the half no existence check can
		// see. The checks above prove every model points at a texture that exists; none of them says
		// the file is an image. A texture that is present but truncated passes all of them, ships in
		// the jar, and draws in game as the missing-texture checkerboard with nothing in any log to
		// explain it - and a truncated file is exactly what a half-synced iCloud Drive leaves
		// behind, which this working copy is inside of. Three readings, each cheap and each fatal on
		// its own: the 8-byte PNG signature, the dimensions out of IHDR (a zero-pixel image is a
		// blank), and the IEND chunk a complete PNG always ends with.
		File packTextureRoot = new File(projectDir, 'resourcepack/assets/fortuneandfavors/textures')
		int texturesChecked = 0
		if (packTextureRoot.exists()) {
			packTextureRoot.eachFileRecurse { File f ->
				if (!f.isFile() || !f.name.toLowerCase().endsWith('.png')) {
					return
				}
				texturesChecked++
				String where = 'resourcepack/assets/fortuneandfavors/textures/' + f.path.substring(packTextureRoot.path.length() + 1)
				byte[] bytes = f.bytes
				if (bytes.length < 32) {
					problems << "${where} is ${bytes.length} byte(s) - too small to be an image, and an empty texture draws as the missing-texture checkerboard"
					return
				}
				if ((bytes[0] & 0xFF) != 0x89 || (bytes[1] & 0xFF) != 0x50 || (bytes[2] & 0xFF) != 0x4E || (bytes[3] & 0xFF) != 0x47) {
					problems << "${where} does not start with a PNG signature - it is not an image, so no model can draw it"
					return
				}
				int texW = ((bytes[16] & 0xFF) << 24) | ((bytes[17] & 0xFF) << 16) | ((bytes[18] & 0xFF) << 8) | (bytes[19] & 0xFF)
				int texH = ((bytes[20] & 0xFF) << 24) | ((bytes[21] & 0xFF) << 16) | ((bytes[22] & 0xFF) << 8) | (bytes[23] & 0xFF)
				if (texW <= 0 || texH <= 0) {
					problems << "${where} declares ${texW}x${texH} - an image with no pixels draws as the missing-texture checkerboard"
					return
				}
				if ((bytes[bytes.length - 8] & 0xFF) != 0x49 || (bytes[bytes.length - 7] & 0xFF) != 0x45
					|| (bytes[bytes.length - 6] & 0xFF) != 0x4E || (bytes[bytes.length - 5] & 0xFF) != 0x44) {
					problems << "${where} has no trailing IEND chunk - it is a truncated copy, so the client draws the checkerboard for it"
				}
			}
		}
		logger.lifecycle("ffAuditSources: ${texturesChecked} texture(s) are complete images (signature, dimensions and end marker).")

		// And the downloadable pack has to still be the pack that was built from this art.
		//
		// The zip is a separate artifact nobody's build regenerates - `tools/build_resourcepack.py`
		// is run by hand, and the only thing this file ever checked about it was the alias table
		// inside the script. So the one failure mode that costs a player anything is invisible: a
		// texture is added or replaced, the zip is not rebuilt, and the pack people download renders
		// the new item as the vanilla thing it is built on. The check is exact rather than a
		// timestamp - the zip must carry one entry per PNG under `resourcepack/assets`, which the
		// builder copies verbatim - because a timestamp on an iCloud file says very little.
		File packZip = new File(projectDir, 'fortuneandfavors-resourcepack.zip')
		if (packZip.exists()) {
			int sourcePngs = 0
			File packAssetsRoot = new File(projectDir, 'resourcepack/assets')
			if (packAssetsRoot.exists()) {
				packAssetsRoot.eachFileRecurse { File f ->
					if (f.isFile() && f.name.toLowerCase().endsWith('.png') && !ICLOUD_CONFLICT(f.name)) {
						sourcePngs++
					}
				}
			}
			int zipPngs = 0
			try {
				java.util.zip.ZipFile zip = new java.util.zip.ZipFile(packZip)
				try {
					zip.entries().each { entry ->
						if (!entry.directory && entry.name.startsWith('assets/') && entry.name.toLowerCase().endsWith('.png')) {
							zipPngs++
						}
					}
				} finally {
					zip.close()
				}
			} catch (Exception e) {
				problems << "fortuneandfavors-resourcepack.zip cannot be read as a zip (${e.message?.take(120)}) - the download is corrupt, and a pack nobody can open is every texture missing at once"
			}
			if (zipPngs != sourcePngs) {
				problems << "fortuneandfavors-resourcepack.zip carries ${zipPngs} texture(s) under assets/ but the pack has ${sourcePngs} - the download is stale or incomplete, so items drawn from the newer art render as the vanilla item they are built on. Run: python3 tools/build_resourcepack.py"
			} else {
				logger.lifecycle("ffAuditSources: the downloadable pack carries all ${zipPngs} texture(s) the art folder has.")
			}
		}

		// The boss managers run on one clock.
		//
		// The frozen-clock trap, and the reason this is a gate rather than a comment: a level's
		// own game time does not advance outside the overworld - `ServerLevel.tickTime()` is the
		// only writer and it returns immediately unless the level was created with tickTime true,
		// and the only level created that way is the overworld. Every dimension this mod makes
		// (the expedition realm, the duel realm, the prison, the snow realm) and every other
		// vanilla dimension (the End, the Nether) therefore has a game time frozen at the value it
		// was born with, and two failure modes follow from that, both silent:
		//
		//   * a deadline written against one clock and read back against another is a deadline that
		//     has always already passed, because the live clock is ahead of the frozen one by
		//     however long the server has been up - a boss that fires every move on the tick it
		//     schedules it;
		//   * a `% N == 0` gate against a frozen zero is true on every tick, so a "once a second"
		//     effect runs twenty times a second. That one was a real leak in the dragon's aura.
		//
		// The shared clock (economy/ServerClock) is the server's own tick counter plus a base that
		// survives a restart, and it reads the same from any dimension - which is what lets a realm
		// fight and an overworld fight run the same code. These files are now entirely on it. That
		// is only checkable while the direct read is not allowed back in, and the read is a plausible
		// thing to type: it is what every vanilla example does. It is the only rule in this audit
		// that is about a call being absent rather than present, so it says why in the message.
		def clockManagers = [
			'BossManager', 'PuppeteerManager', 'TimeLordManager', 'ClockworkKingManager',
			'ScarletDevilManager', 'VoidShaperManager', 'StarboundMagisterManager',
			'DrownedSovereignManager', 'EmeraldSovereignManager', 'GaleWardenManager',
			'WitherReworkManager', 'PlayerRaidManager'
		]
		def clockChecked = 0
		def clockStrays = 0
		clockManagers.each { String name ->
			File f = new File(srcRoot, "economy/${name}.java")
			if (!f.exists()) {
				problems << "economy/${name}.java is gone - it was moved onto the shared clock and this audit no longer covers it"
				return
			}
			clockChecked++
			def body = stripComments(f)
			def lines = body.readLines()
			lines.eachWithIndex { String line, int i ->
				if (line =~ /\.getGameTime\(\)/) {
					clockStrays++
					problems << "economy/${name}.java:${i + 1} reads level.getGameTime() - outside the overworld that clock is frozen, so a timer built from it never fires (use ServerClock.clock(...))"
				}
			}
			if (!(body =~ /ServerClock\.clock\(/)) {
				problems << "economy/${name}.java never reads the shared clock - either it went back onto a level's game time, or its timers are gone and that is worth saying out loud"
			}
		}
		// The command guards and the two spellings of a typed command.
		//
		// A typed command arrives as ServerboundChatCommandPacket when the client has no chat
		// session and as ServerboundChatCommandSignedPacket when it has one. Both funnel through
		// the private tryHandleChat; a guard that hangs off handleChatCommand alone is a lock on
		// one of two doors, and the one it misses is the one every online-mode client uses - which
		// is exactly how /shop kept opening in prison after it had been "blocked". Guarding
		// tryHandleChat also keeps the signed packet's last-seen-messages bookkeeping intact, since
		// vanilla applies that before it gets here. This is checkable only while the two guards
		// stay on the shared door, so it is a gate rather than a comment.
		def guardMixins = ['PrisonCommandGuardMixin', 'DuelCommandGuardMixin']
		guardMixins.each { String name ->
			File f = new File(srcRoot, "mixin/${name}.java")
			if (!f.exists()) {
				problems << "mixin/${name}.java is gone - it was the guard a blocked command slipped past"
				return
			}
			def body = stripComments(f)
			if (!(body =~ /method = "tryHandleChat"/)) {
				problems << "mixin/${name}.java does not guard tryHandleChat - the one place the signed and unsigned command packets meet, so a client with a chat session walks straight past it (and /shop opens in prison)"
			}
			if (body =~ /method = "handleChatCommand"/) {
				problems << "mixin/${name}.java still guards handleChatCommand alone - move it to tryHandleChat so the signed spelling is covered too"
			}
		}
		logger.lifecycle("ffAuditSources: ${guardMixins.size()} command guard(s) watch tryHandleChat, the one door both command packets use.")
		if (!problems.isEmpty()) {
			problems.each { logger.error("ffAuditSources: ${it}") }
			throw new GradleException("ffAuditSources found ${problems.size()} problem(s) - see above.")
		}
		logger.lifecycle("ffAuditSources: ${clockChecked} boss manager(s) time every deadline on the shared clock (${clockStrays} frozen-clock read(s) left).")
		logger.lifecycle("ffAuditSources: ${sourceFiles.size()} datapack file(s), ${recipeIds.size()} recipe(s), ${registered.size()} command literal(s) - all consistent.")
	}
}

tasks.register('ffSelfTest') {
	group = 'verification'
	description = 'Boots a headless server, runs the mod self-test, and fails the build if any feature is broken.'
	dependsOn 'runServer'

	doLast {
		def report = reportFile.get().asFile
		if (!report.exists()) {
			throw new GradleException(
				"ffSelfTest: no report at ${report}. The server never reached the self-test "
					+ "(look for '[FF-SELFTEST] armed' in the runServer output)."
			)
		}
		def json = new groovy.json.JsonSlurper().parse(report)
		int failed = json.failed.toInteger()
		if (failed > 0) {
			(json.failures ?: []).each { logger.error("ffSelfTest FAIL: ${it}") }
			throw new GradleException("ffSelfTest: ${failed} check(s) failed - do not ship this build.")
		}
		logger.lifecycle("ffSelfTest: ${json.passed} check(s) passed, ${json.skipped ?: 0} skipped, ${json.warnings ?: 0} warning(s).")
	}
}

tasks.named('check') {
	dependsOn 'ffAuditSources'
}

// Anything that turns sources/resources into a runnable game gets the scrub first.
tasks.matching { it.name == 'runServer' || it.name == 'runClient' || it.name.startsWith('runDatagen') || it.name == 'jar' || it.name == 'remapJar' }.configureEach {
	dependsOn 'scrubICloudConflicts'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// ---------------------------------------------------------------------------
// Ship the item art.
//
// The client jar IS a resource pack: every model, texture and vanilla item
// definition it carries is loaded straight off the mod, which is why an item
// whose art only existed in `resourcepack/` rendered as the plain vanilla item
// it is built on - the standalone zip is a separate, optional download nobody
// had installed.
//
// `resourcepack/assets` is the single source of truth for that art (it is what
// the pack generators write and what the standalone zip is built from), and it
// feeds `processResources` directly - a second resource root rather than a copy
// task - so the art lands in the *main* output.
//
// It used to be mirrored into the client source set instead, which put the art
// only on the side that has a renderer: a dev-only server - which is where the
// self-test boots, and what "the textures are broken on the server side" looks
// like from a build - and any server-side reader of the pack saw a mod carrying
// no art at all. One copy, in the resources every side loads.
//
// The scope is `assets/**`: `pack.mcmeta`/`pack.png` sit beside `assets/` in the
// pack root and the standalone zip needs them, but the jar must not carry them -
// a mod root with a pack.mcmeta of its own confuses the built-in pack.
//
// ... and the same art is staged a second time, as a *pack root of its own* inside the
// jar, so it can be registered as a built-in pack that is always on (see
// `FortuneFavorsMod.registerArtPack`). The two copies are not redundancy for its own
// sake: the loose copy is what every side reads today, and the staged copy is what makes
// the art survive a client whose shared "mod resources" entry has been switched off in
// the resource-pack screen - which is what "the mod's textures unload" looks like from
// the outside, because with that entry off every custom item renders as the plain
// vanilla thing it is built on. If the registration is ever refused, the loose copy is
// still there and the art still loads.
//
// The staged copy is the *art* pack - that is its registered name - and it stops at art on
// purpose: the four boss music tracks are ~4.7 MB of already-compressed OGG, so duplicating
// them here cost a second 4.7 MB of the jar and bought nothing, since the loose copy is the
// one every side reads today and the track is only ever resolved from one of them. The
// trade is that a client with the shared "mod resources" entry switched off keeps its custom
// item art and loses the fight music; the reverse split would put the music on the path a
// user toggle can disable. `sounds.json` goes with them, because a definition with no file
// behind it in the same pack is not a definition.
//
tasks.named('processResources') {
	from(layout.projectDirectory.dir('resourcepack')) {
		include 'assets/**'
	}
	from(layout.projectDirectory.dir('resourcepack')) {
		into 'resourcepacks/art'
		exclude 'assets/fortuneandfavors/sounds/**'
		exclude 'assets/fortuneandfavors/sounds.json'
	}
}

//
// The in-game `/changelog` command reads `data/fortuneandfavors/changelog.txt`
// out of the jar. That file had drifted eleven releases behind CHANGELOG.md,
// because keeping two copies of the same document in step is a thing people
// forget. It is a generated artifact now: CHANGELOG.md is the only copy anyone
// edits. It is folded into processResources rather than copied afterwards by a
// second task: writing into processResources' own output directory from another
// task makes Gradle 9 reject the build for an undeclared task dependency, and a
// task that mutates another task's output can be skipped or reordered out from
// under the jar. One task owns that directory, so the copy is always atomic with
// the rest of the resources. (A stale checked-in fallback under
// src/main/resources is excluded here so there is exactly one source of truth;
// the self-test's `changelog.current` assertion still fails the build when the
// bundled copy and the mod version disagree.)
tasks.named('processResources') {
	exclude 'data/fortuneandfavors/changelog.txt'
	from(layout.projectDirectory.file('CHANGELOG.md')) {
		into 'data/fortuneandfavors'
		rename { 'changelog.txt' }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// A mod jar is compiled classes plus a `fabric.mod.json`. A sources jar is `.java` files, and the
// two share a folder and a name prefix in `build/libs` - so how they differ has to be *enforced*,
// not merely intended.
//
// `withSourcesJar()` copies the main source set's resources into the sources jar, which means the
// manifest travels with the code: with it inside, Fabric Loader accepts the sources jar as the mod,
// finds no classes, and dies on the first mixin it looks for. That is not hypothetical - it is
// exactly "The specified mixin 'com.fortuneandfavors.mixin.ServerGamePacketListenerMixin' was not
// found" from a client whose mods folder held only `fortuneandfavors-1.8-sources.jar`, with a mod
// version reading the literal `${version}` because the sources jar never had it expanded.
//
// So the manifest comes out. An IDE attaching sources wants the code and nothing else, and without
// `fabric.mod.json` the loader does not recognise the file as a mod at all - which is the right
// answer for an artifact that is not one. The assertion after it exists because "it should be
// excluded" and "it is excluded" are different claims, and only one of them is checkable.
tasks.named('sourcesJar') {
	exclude 'fabric.mod.json'
	doLast {
		def strays = zipTree(archiveFile.get().asFile).matching { include 'fabric.mod.json' }.files
		if (!strays.isEmpty()) {
			throw new GradleException(
				"the sources jar carries fabric.mod.json, so it can be installed as a mod - it has no compiled " +
				"classes and every mixin it declares will be missing. Do not ship build/libs/*-sources.jar."
			)
		}
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}

	// Always exclude any "<name> <number>.<ext>" conflict copy from the jar, no
	// matter what iCloud dropped into the build directory (see scrubICloudConflicts).
	exclude { details -> ICLOUD_CONFLICT(details.name) }
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
