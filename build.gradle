		// 16) Every boss's damage is scaled in exactly ONE place. This mod has fifteen fights, each in
		//     its own file with its own damage constants, and "the bosses are too easy" is answered
		//     once in BossEmpowerment and read once in the damage pipeline. Two failure shapes have to
		//     be impossible: a second read - a boss multiplied twice, which is a silent doubling nobody
		//     would look for in a fight-balance change - and no read at all, which is a layer of auras
		//     and moves sitting on top of fights that were never actually made harder.
		def empowermentFile = new File(srcRoot, 'economy/BossEmpowerment.java')
		if (!empowermentFile.exists()) {
			problems << "economy/BossEmpowerment.java is gone - the shared boss layer is unaudited"
		} else {
			def multiplierFiles = [] as Set
			allSources.each { File f ->
				if (f.name.endsWith('.java') && f.getText('UTF-8').contains('DAMAGE_MULTIPLIER')) {
					multiplierFiles << f.name
				}
			}
			def allowed = ['BossEmpowerment.java', 'CombatBalanceMixin.java', 'SelfTest.java'] as Set
			multiplierFiles.each { name ->
				if (!allowed.contains(name)) {
					problems << "the boss damage multiplier is named in ${name} - it is declared in BossEmpowerment.java, applied once in CombatBalanceMixin.java and read by the self-test, so anywhere else is either a second buff or a second tuning"
				}
			}
			String combatMixinText = new File(srcRoot, 'mixin/CombatBalanceMixin.java').getText('UTF-8')
			int multiplierUses = combatMixinText.count('DAMAGE_MULTIPLIER')
			if (multiplierUses != 1) {
				problems << "CombatBalanceMixin reads the boss damage multiplier ${multiplierUses} time(s) - it has to be applied exactly once, on the attacker"
			}
			String empowermentText = empowermentFile.getText('UTF-8')
			if (!empowermentText.contains('isEmpowered(')) {
				problems << "BossEmpowerment lost isEmpowered - the damage pipeline has nothing to ask whether a body is a boss"
			}
			if (empowermentText.contains('import net.minecraft.client.')) {
				problems << "economy/BossEmpowerment.java reaches for the client - a boss layer is server side or it is a desync"
			}
			logger.lifecycle("ffAuditSources: the shared boss layer scales damage in one place (${multiplierFiles.sort()}).")
		}

		// 17) A totem pop used to end the session. autototem 1.1.0 builds its re-stock click on the
		//     client's own thread with a literal `null` where vanilla passes
		//     `ClientPacketListener.decoratedHashOpsGenenerator()`, and that generator is dereferenced
		//     once per component - so the NullPointerException comes up out of the packet handler and
		//     the client is disconnected with "Network Protocol Error", on any totem pop whose spare
		//     sits outside the hotbar, in singleplayer as much as anywhere else. Nothing we ship can
		//     change what that mod's bytecode asks for; what we can do is refuse to be killed by it,
		//     which is four lines in a client mixin. That is exactly the shape of code that gets
		//     tidied away as scaffolding: delete it and the file still compiles, every self-test stays
		//     green, and the failure only comes back the next time a totem pops. So the build holds
		//     both ends - the injection itself, and the registration that makes Mixin see it at all.
		File hasherGuardFile = new File(projectDir, 'src/client/java/com/fortuneandfavors/client/mixin/HashedPatchMapMixin.java')
		//     The config that ships is the one in the *client source set's* resources - there is a
		//     second copy of this file at the project root that is copied into no jar at all, and
		//     registering a mixin in that one looks exactly like working wiring and changes nothing.
		//     The rule reads the file the client resources actually carry.
		File clientMixinConfig = new File(projectDir, 'src/client/resources/fortuneandfavors.client.mixins.json')
		if (!hasherGuardFile.exists()) {
			problems << 'client/mixin/HashedPatchMapMixin.java is gone - a mod that hashes a stack with a null generator disconnects the client again, which is what autototem 1.1.0 does on every totem pop'
		} else {
			String guardText = hasherGuardFile.getText('UTF-8')
			if (!(guardText =~ /@Mixin\(HashedPatchMap\.class\)/)) {
				problems << 'HashedPatchMapMixin no longer mixes into HashedPatchMap - the guard is aimed at a class that cannot receive it'
			}
			if (!(guardText =~ /@Inject\(method = "create", at = @At\("HEAD"\), cancellable = true\)/)) {
				problems << 'the hash guard is no longer an injectable, cancellable call at the head of HashedPatchMap.create - the generator is dereferenced again before anything can answer for it'
			}
			if (!(guardText =~ /hasher == null/)) {
				problems << 'the hash guard no longer asks whether the generator is missing, so it guards nothing'
			}
		}
		if (!clientMixinConfig.exists()) {
			problems << 'fortuneandfavors.client.mixins.json is gone - not one client mixin is registered'
		} else if (!(clientMixinConfig.getText('UTF-8') =~ /"HashedPatchMapMixin"/)) {
			problems << 'HashedPatchMapMixin is not listed in fortuneandfavors.client.mixins.json - Mixin never applies it and the guard is dead code'
		}

		// 30) The two newest sets are forged with the material their own boss pays, and with nothing
		//     else. Both shipped without one: the forge's accept test was a chain of per-set branches
		//     whose final `else` was an unconditional "Shattered Mind", so a Leviathan's Grasp was
		//     upgraded by a Mindbinder's material while Abyssal Pearls and Gale Cores did not exist.
		//     The chain is one lookup now, and these rules hold both ends of it - the mapping, and the
		//     drop that feeds it. A set with no material is not a style problem: it is gear that can
		//     never leave Tier I, and the failure is invisible until a player tries.
		def forgeOpsFile = new File(srcRoot, 'economy/ForgeOps.java')
		if (!forgeOpsFile.exists()) {
			problems << 'economy/ForgeOps.java is gone - the Item Forge is unaudited'
		} else {
			def forgeOpsText = stripComments(forgeOpsFile)
			if (!(forgeOpsText =~ /isSeaLegendary\(legendary\)\)\s*\{\s*return ModItems\.abyssalPearl\(\)/)) {
				problems << 'the sea set no longer maps to the Abyssal Pearl in ForgeOps.upgradeMaterialFor - it is upgraded with whatever the mapping falls through to, which was a Mindbinder material'
			}
			if (!(forgeOpsText =~ /isGaleLegendary\(legendary\)\)\s*\{\s*return ModItems\.galeCore\(\)/)) {
				problems << 'the sky set no longer maps to the Gale Core in ForgeOps.upgradeMaterialFor - it has no material of its own, so it can never reach Tier II'
			}
		}
		[
			'economy/DrownedSovereignManager.java': ['ModItems.abyssalPearl()', 'the Drowned Sovereign stopped paying Abyssal Pearls'],
			'economy/GaleWardenManager.java'      : ['ModItems.galeCore()', 'the Gale Warden stopped paying Gale Cores']
		].each { rel, spec ->
			def bossFile = new File(srcRoot, rel)
			if (!bossFile.exists()) {
				problems << "${rel} is gone - its boss is unaudited"
				return
			}
			def bossText = stripComments(bossFile)
			if (!bossText.contains(spec[0])) {
				problems << "${spec[1]} - the set it guards can never be taken past Tier I"
			}
			if (bossText.contains('ModItems.magicalEssence()')) {
				problems << "${rel} pays the shared Magical Essence as well - that is not a material either new set can be upgraded with"
			}
		}

		// 31) The shared particle budget has to be zeroed once a tick, and nothing called the reset.
		//     One absent line, and the failure is completely silent: BossVfx stops drawing for a
		//     player once their share is gone, so the first effect of a session spent it and every
		//     effect after that - every boss, and the Mirage Castle's collapse - drew nothing for the
		//     rest of the session. No exception, no log line, no failing self-test; from the player's
		//     side the bosses simply had no effects. This is the only place that can catch it.
		def bossVfxFile = new File(srcRoot, 'economy/BossVfx.java')
		if (!bossVfxFile.exists()) {
			problems << 'economy/BossVfx.java is gone - every boss effect is unbudgeted'
		} else if (!(stripComments(bossVfxFile) =~ /public static void beginTick\(\)/)) {
