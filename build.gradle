			['ModItems.java', /MONARCH_KEEPING_KEY/, 'ModItems: the monarch\'s keepings are no longer marked, so nothing can tell a rare drop from the castle\'s own loot'],
			['economy/MirageCastleManager.java', /ModItems\.isMonarchKeeping\(item\.getItem\(\)\)/, 'MirageCastleManager: the teardown sweep no longer spares the monarch\'s keepings, so killing him and letting the event end deletes a rare drop off the floor'],
			['economy/MirageCastleManager.java', /keepingsForRoll\(RANDOM\.nextInt\(100\)/, 'MirageCastleManager: the drop no longer asks the same band the checks walk, so what falls and what is proven are two different tables'],
			['mixin/AnvilMixin.java', /ModItems\.overMaxLevelBook\(book\)/, 'AnvilMixin: a vanilla book above its enchantment\'s maximum is no longer routed to the mod\'s merge, so the anvil silently clamps it to V']
		].each { entry ->
			File owner = new File(srcRoot, entry[0])
			if (!owner.exists()) {
				problems << "${entry[0]} is gone - ${entry[2]}"
				return
			}
			def ownerText = owner.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(ownerText =~ entry[1])) {
				problems << entry[2]
			}
		}
		File keepingsOwner = new File(srcRoot, 'economy/MirageCastleManager.java')
		if (keepingsOwner.exists()) {
			def ownerText = keepingsOwner.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			int mints = (ownerText =~ /ModItems\.monarchsEfficiencyBook\(/).count
			if (mints != 1) {
				problems << "MirageCastleManager mints the monarch's Efficiency VII book ${mints} time(s) rather than 1 - the book is meant to have exactly one faucet, the roll the checks walk"
			}
		}

		// 23) The item art has to keep loading on a client that has switched the shared "mod
		//     resources" entry off, which is what "the mod's textures unload" looks like from the
		//     outside: the art is in the mod, but loose, so it rides on that one entry and every
		//     custom item renders as the plain vanilla thing it is built on without it. The fix is a
		//     pack of the mod's own, always on - so the registration, the activation type and the
		//     staged pack root all have to be present, and the staged root has to be where Fabric
		//     looks for a sub-pack (`resourcepacks/<path>`) rather than wherever a rename leaves it.
		[
			['FortuneFavorsMod.java', /registerBuiltinPack\(\s*ART_PACK_ID/, 'FortuneFavorsMod: the item art is no longer registered as a pack of its own, so a client with the shared mod-resources entry switched off loses every custom texture'],
			['FortuneFavorsMod.java', /PackActivationType\.ALWAYS_ENABLED/, 'FortuneFavorsMod: the art pack is registered but no longer always-on, so it can be switched off - which is the bug it exists to fix'],
			['FortuneFavorsMod.java', /ART_PACK_ROOT = "resourcepacks\/art"/, 'FortuneFavorsMod: the staged pack root moved - Fabric looks for a sub-pack at resourcepacks/<path>, and a root anywhere else is a pack that registers and finds nothing'],
			['../../../../../build.gradle', /into 'resourcepacks\/art'/, 'build.gradle: the art pack root is no longer staged inside the jar, so the always-on pack has nothing to load'],
			['economy/MiningZoneManager.java', /MINUTE_ZONE_CONTAINMENT/, 'MiningZoneManager: the containment sweep no longer owns its own slot in the minute cycle, so it shares a tick with the expedition prune and the mailbox cleanup again'],
			['economy/ExpeditionManager.java', /MINUTE_EXPEDITION_PRUNE/, 'ExpeditionManager: the cooldown prune no longer owns its own slot in the minute cycle'],
			['ModEvents.java', /MINUTE_MAILBOX/, 'ModEvents: the guild mailbox cleanup no longer owns its own slot in the minute cycle'],
			// A vanish that says something is a vanish that changes what people do, and a spectate
			// that tells the player they are being watched is worse than useless - the only reason to
			// look at somebody is to see what they do when nobody is looking. The four lines below
			// are the four ways this batch could quietly come undone: the announcement coming back,
			// the moderator being put in spectator mode where they cannot open or hold anything,
			// the inventory no longer being written to disk before the kit replaces it, and the ninth
			// slot no longer being the way out.
			['anticheat/SpectateKit.java', /NbtIo\.writeCompressed/, 'SpectateKit: the staff inventory is no longer written to disk before the kit replaces it, so a crash mid-spectate eats the gear of a moderator'],
			['anticheat/SpectateKit.java', /case EXIT ->/, 'SpectateKit: the ninth slot no longer stops the spectate, so the only way out is a command somebody has to remember'],
			['ModEvents.java', /SpectateKit\.onJoin/, 'ModEvents: nothing hands a stranded moderator their gear back on join, so a restart mid-watch leaves them holding a kit and missing their items'],
			['economy/EmeraldSovereignManager.java', /MISSING_GRACE_TICKS/, 'EmeraldSovereignManager: the body-missing grace window is gone, so a boss in an unloaded chunk is torn down - bar and all - with nothing dropped'],
			// The mirage's fall: the deadline, the trigger, and the one exception to the castle's own
			// rescue. Any of the three going away turns "the hall comes down and you have a minute"
			// into "the hall ends quietly", or into a fall that teleports everybody home.
			['economy/MirageCastleManager.java', /COLLAPSE_ESCAPE_TICKS/, 'MirageCastleManager: the escape window is gone, so killing the monarch ends the castle with nobody having to leave it'],
			['economy/MirageCastleManager.java', /beginCollapse\(server\)/, 'MirageCastleManager: nothing starts the fall when the monarch dies'],
			['economy/MirageCastleManager.java', /FATED\.contains\(player\.getUUID\(\)\)/, 'MirageCastleManager: the fall no longer stands the castle rescue aside, so a player still inside when it crumbles is teleported home instead of killed'],
			// The blast moved onto the shared budget (mirageParticles -> BossVfx) so a Bedrock client is
			// handed a bounded version of it instead of a queue it cannot drain. The question this pin
			// asks is unchanged - is the castle still announced - so it follows the call rather than
			// the literal, and either spelling of the send passes only if the blast is still there.
			['economy/MirageCastleManager.java', /(sendParticles|mirageParticles)\(\s*\n?\s*ParticleTypes\.EXPLOSION_EMITTER/, 'MirageCastleManager: the final blast is gone, so the castle disappears without the explosion that announces it'],
			// Heat is fire, and lava is the only heat that lasts. A campfire timer and a heat list with
			// no torches or lamps in it are the two halves of that rule.
			['economy/ServerDisasterManager.java', /CAMPFIRE_EMBERS/, 'ServerDisasterManager: campfires no longer burn out, so one lit campfire answers a whole snowstorm'],
			['economy/ServerDisasterManager.java', /CAMPFIRE_LIFE_TICKS/, 'ServerDisasterManager: the campfire burn-down window is gone']
		].each { entry ->
			File owner = new File(srcRoot, entry[0])
			if (!owner.exists()) {
				problems << "${entry[0]} is gone - ${entry[2]}"
				return
			}
			def ownerText = owner.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
			if (!(ownerText =~ entry[1])) {
				problems << entry[2]
			}
		}
		// ... and none of the three may go back to the bare gate the collision was made of.
		[
			['economy/MiningZoneManager.java', /tick % 1200L == 0L/],
			['economy/ExpeditionManager.java', /tick % 1200L == 0L/],
			['ModEvents.java', /getTickCount\(\) % 1200L == 0L/]
		].each { entry ->
			File owner = new File(srcRoot, entry[0])
			if (owner.exists()) {
				def ownerText = owner.getText('UTF-8').replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
				if (ownerText =~ entry[1]) {
					problems << "${entry[0]} is back on the bare `% 1200 == 0` gate, so once a minute one tick pays for every once-a-minute task at once"
				}
